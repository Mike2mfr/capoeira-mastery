<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Capoeira Mastery</title>
<style>
:root{--bg:#000;--card:#111;--card2:#1a1a1a;--line:#262626;--txt:#f2f2f2;--mut:#9a9a9a;--acc:#f5c542;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header h1 span{color:var(--acc)}
header p{margin:2px 0 0;color:var(--mut);font-size:12px}
main{padding:16px 16px 100px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#0a0a0a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .i{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.btn{background:var(--acc);color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lv{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.move{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.move:last-child{border-bottom:0}
.move b{font-weight:600}
.move .en{color:var(--mut);font-size:12.5px}
.done{color:var(--acc)}
ul{padding-left:18px;margin:6px 0}
li{margin:3px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--card);color:var(--mut);border:0;padding:8px 4px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#000;font-weight:700}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--acc)}
.blk{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border-bottom:0}
.blk .d{color:var(--acc);font-size:13px;text-align:right;max-width:48%}
.link{color:var(--txt);text-decoration:underline;text-decoration-color:#555;cursor:pointer}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.weeks button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;position:relative}
.weeks button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.weeks button.full::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.tag{font-size:11px;color:#000;background:var(--acc);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.seq span{background:var(--card2);border-radius:7px;padding:3px 8px;font-size:12.5px}
.seq span.arrow{background:none;color:var(--mut);padding:3px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:#0d0d0d;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;width:100%;max-width:720px;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
#sheet .x{float:right;background:var(--card2);border:0;color:var(--txt);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
label.chk{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0}
label.chk input{width:20px;height:20px;accent-color:var(--acc)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.langs{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.langs button{background:var(--card);color:var(--mut);border:0;padding:5px 8px;font-size:11px;font-weight:600;cursor:pointer}
.langs button.on{background:var(--acc);color:#000}
.ai{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding:6px 10px;margin-top:10px}
</style>
</head>
<body>
<header><div class="hrow"><h1>CAPOEIRA <span>MASTERY</span></h1><div id="langs" class="langs"></div></div><p id="sub"></p></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"><div id="sheet"></div></div>
<script>
const ALL = {"en": {"cats": [{"id": "fund", "name": "Basics", "en": "Fundamentos", "color": "#f5c542", "intro": "Ginga, the low positions and the ground escapes. Everything in capoeira grows out of these, so they come back in every session of the program."}, {"id": "atk", "name": "Offense", "en": "Ataques", "color": "#ff5a4e", "intro": "Kicks, sweeps and takedowns. Capoeira kicks are mostly circular and come out of the ginga; you train them slowly and controlled first, then with speed."}, {"id": "def", "name": "Defense", "en": "Defesas", "color": "#4ea8ff", "intro": "Capoeira defends by getting out of the way (esquivas) and staying low, rarely by blocking. A good defense always ends in a position you can counter from."}, {"id": "flo", "name": "Floreios", "en": "Flourishes", "color": "#b36bff", "intro": "Hand-balance and spinning movements used to show skill, to change level and to flow between attacks. Your handstand base gives you a big head start here."}, {"id": "flip", "name": "Flips", "en": "Acrobacias", "color": "#3fd18b", "intro": "Airborne and walkover movements. Train them on grass or a thick mat, never tired, and with a spotter for the first full attempts. Each one lists the move you should own first."}], "levels": {"1": "Beginner", "2": "Intermediate", "3": "Advanced"}, "moves": [{"id": "ginga", "name": "Ginga", "cat": "fund", "lvl": 1, "en": "The swing", "what": "The constant rocking step of capoeira: a triangle step from side to side with one leg back at a time, the opposite arm guarding the face. It keeps you moving, hides your next move and loads every kick and escape.", "cues": ["Feet stay shoulder-width; the back foot steps diagonally behind, never straight back.", "Knees bent the whole time - your head should not bob up and down.", "The arm on the side of the forward leg crosses in front of the face.", "Chest slightly forward over the front knee; weight on the balls of the feet."], "mistakes": ["Standing tall and stiff-legged.", "Stepping straight back so the stance becomes narrow.", "Dropping the guard arm.", "Looking at the floor."], "drills": ["Static triangle: step into each corner and hold 3 s.", "Slow ginga to a 4-count, 2 minutes.", "Ginga with a wider, lower stance (thighs near parallel).", "Ginga in a circle and changing rhythm (slow, fast, broken)."], "alt": "Shorter step and a higher stance until your legs adapt."}, {"id": "cocorinha", "name": "Cocorinha", "cat": "fund", "lvl": 1, "en": "Little squat", "what": "A full deep squat with heels down, one arm guarding the head. The first defense against high kicks and the bottom position for many transitions.", "cues": ["Heels flat, knees out over toes.", "Guard arm bent above the head, other hand can touch the floor.", "Eyes on the opponent - head up."], "mistakes": ["Heels lifting.", "Dropping the head between the knees.", "Collapsing forward onto the hands."], "drills": ["Deep squat holds, 3 x 30 s.", "Ginga to cocorinha and back, 10 each side.", "Cocorinha shuffle - move sideways staying low."], "alt": "Heels on a small wedge or plate until ankle mobility improves."}, {"id": "negativa", "name": "Negativa", "cat": "fund", "lvl": 1, "en": "The negative", "what": "A low position on one bent leg with the other leg stretched along the floor, one hand on the floor and the other guarding the face. A defense, a ground base and the start of rolê and rasteira.", "cues": ["Support leg fully bent, foot flat.", "Extended leg straight, foot flexed, resting on the heel or side of the foot.", "Supporting hand placed beside the hip, not behind you.", "Chest turned toward the extended leg, guard arm up."], "mistakes": ["Sitting on the floor.", "Hand too far behind so the chest opens to the sky.", "Extended leg bent."], "drills": ["Ginga to negativa, 8 per side slowly.", "Negativa switches: pass from one side to the other staying low.", "Negativa to rolê to ginga flow."], "alt": "Place the hand on a yoga block to raise the floor."}, {"id": "role", "name": "Rolê", "cat": "fund", "lvl": 1, "en": "The roll-away", "what": "A low turning displacement on the hands and feet, used to escape and change sides. From negativa you rotate over both hands and come back facing the opponent.", "cues": ["Both hands planted, hips stay low.", "Turn the head first, the hips follow.", "Finish in negativa or ginga facing forward."], "mistakes": ["Hips too high (becomes a bear crawl).", "Losing sight of the opponent for too long."], "drills": ["Rolê from negativa, 6 each way.", "Rolê chain across the room and back.", "Rolê into aú."], "alt": "Do the turn in two steps: hands first, then feet."}, {"id": "au", "name": "Aú", "cat": "fund", "lvl": 1, "en": "Capoeira cartwheel", "what": "A cartwheel with the eyes on the opponent, legs passing slightly bent or open, often slower and more controlled than a gym cartwheel. Used to move in and out of the game.", "cues": ["Look between your hands toward where the opponent would be, not at the floor.", "Hands land one after the other in a line.", "Legs open wide over the top, active toes.", "Land in ginga or negativa, ready."], "mistakes": ["Looking at the floor.", "Piking at the hips so the aú becomes a hop.", "Landing upright and flat-footed."], "drills": ["Low aú with bent legs over a line.", "Aú to the left and right, 6 each.", "Slow aú with a 1 s pause on the hands.", "Aú into negativa."], "alt": "Bent-leg low aú or a kick-over to the side."}, {"id": "queda4", "name": "Queda de quatro", "cat": "fund", "lvl": 1, "en": "Fall onto four", "what": "Dropping back to sit with hands behind you and feet in front - an emergency escape and a base for the macaco.", "cues": ["Hands land behind the hips, fingers turned outward or back.", "Hips stay off the floor.", "Come back up through cocorinha or a rolê."], "mistakes": ["Locked elbows on the landing.", "Sitting down fully."], "drills": ["Squat to queda de quatro, 10 reps.", "Queda de quatro walking forward and back.", "Queda de quatro to bridge push (macaco prep)."], "alt": "Lower slowly from a squat instead of dropping."}, {"id": "ponte", "name": "Ponte", "cat": "fund", "lvl": 2, "en": "Bridge", "what": "The back bend that opens the shoulders and spine for macaco, aú de cabeça and walkovers. Treated here as a daily mobility skill.", "cues": ["Push the floor away until the arms are straight.", "Shoulders over the wrists, not behind them.", "Squeeze glutes lightly, knees track over toes."], "mistakes": ["Bending only at the lower back.", "Feet turned out wide."], "drills": ["Wall slides with arms overhead, 2 x 10.", "Bridge holds 3 x 20 s, feet raised on a step if needed.", "Bridge rocks (shoulders over hands).", "Bridge walk-downs on a wall."], "alt": "Feet elevated bridge or a table-top hold."}, {"id": "meialua_frente", "name": "Meia-lua de frente", "cat": "atk", "lvl": 1, "en": "Front half-moon", "what": "An outside-to-inside circular kick with a straight leg, in front of the body. Usually the first kick taught.", "cues": ["The kick leaves from the back leg of the ginga.", "Leg straight, circle from outside to inside at head height.", "Supporting heel turns slightly; guard stays up.", "Return to ginga - don't let the leg drop and stay."], "mistakes": ["Bending the knee.", "Leaning far back.", "Kicking without coming back to the ginga."], "drills": ["Slow motion kicks touching a hand held at shoulder height.", "10 per side from ginga.", "Double meia-lua (one each leg) in rhythm."], "alt": "Lower height (waist) until hip mobility allows more."}, {"id": "queixada", "name": "Queixada", "cat": "atk", "lvl": 1, "en": "Jaw kick", "what": "An inside-to-outside circular kick: you step across with the front foot, turn the hips, and the back leg circles outward.", "cues": ["Step diagonally to close the hips first.", "The kicking leg rises across the body and opens outward.", "Upper body leans away slightly as a counter-balance."], "mistakes": ["No step - kicking from a square stance.", "Swinging the arms wildly."], "drills": ["Step + hold position, then kick slowly.", "8 per side from ginga.", "Queixada into esquiva lateral."], "alt": "Bent-knee version at waist height."}, {"id": "armada", "name": "Armada", "cat": "atk", "lvl": 1, "en": "Spinning kick", "what": "A spinning outside kick: step across, turn your back briefly, look over the shoulder and sweep the straight leg around.", "cues": ["Step the front foot across, turn on the balls of the feet.", "Head and eyes turn first - spot the target over your shoulder.", "Kicking leg straight, hips stay upright.", "Finish facing forward in ginga."], "mistakes": ["Turning blind (leg before eyes).", "Falling out of the spin.", "Kick too low and bent."], "drills": ["Spin walk-through without kicking, 10 each side.", "Armada touching a target (hand/bag).", "Armada into negativa."], "alt": "Half-turn without the full leg extension."}, {"id": "bencao", "name": "Bênção", "cat": "atk", "lvl": 1, "en": "Blessing / front push kick", "what": "A straight push kick with the sole of the foot to the chest or belly, pushing the opponent away.", "cues": ["Lift the knee first, then push the heel through.", "Hips push forward at the end.", "Retract the leg back to ginga."], "mistakes": ["Snapping the leg (it's a push, not a snap).", "Leaning back too much."], "drills": ["Knee lift + extend slowly, 8 per side.", "Bênção against a wall or bag.", "Bênção to step forward and ginga."], "alt": "Lower target height."}, {"id": "martelo", "name": "Martelo", "cat": "atk", "lvl": 2, "en": "Hammer kick", "what": "A roundhouse kick hitting with the instep - fast and direct, more like a martial arts kick than the circular capoeira kicks.", "cues": ["Pivot the supporting foot.", "Knee comes up and across, then the shin snaps.", "Guard up, eyes on target."], "mistakes": ["No pivot on the standing foot (knee strain).", "Dropping the guard."], "drills": ["Chamber + extend slowly, 6 per side.", "Martelo on a bag or held target.", "Low-mid-high martelo ladder."], "alt": "Knee-height martelo."}, {"id": "chapa", "name": "Chapa", "cat": "atk", "lvl": 1, "en": "Side push kick", "what": "A side or back push kick with the sole of the foot, often thrown from a low or turned position.", "cues": ["Chamber the knee toward the chest.", "Push the heel out sideways, toes slightly down.", "Look past your shoulder at the target."], "mistakes": ["Leaning so far that you lose the guard.", "Kicking with the toes."], "drills": ["Chamber + push, 8 per side.", "Chapa de costas (back kick) from ginga.", "Chapa baixa from the floor (hands down)."], "alt": "Hand on a wall for balance."}, {"id": "compasso", "name": "Meia-lua de compasso", "cat": "atk", "lvl": 2, "en": "Compass half-moon", "what": "The signature capoeira kick: hands go to the floor and you spin, sweeping the heel around in a big arc. Also called rabo de arraia.", "cues": ["Step across, both hands to the floor beside the front foot.", "Look under your arm at the target all through the spin.", "Heel leads, leg straight, hips rotate fully.", "Finish in ginga, guard up."], "mistakes": ["Losing sight of the target.", "Hands too far from the foot.", "Bending the kicking leg."], "drills": ["Hands-down position + slow walk-through.", "Compasso to a target at waist height.", "Full speed compasso 6 per side.", "Compasso into rolê."], "alt": "Lower kick height and slower turn."}, {"id": "rasteira", "name": "Rasteira", "cat": "atk", "lvl": 2, "en": "Sweep", "what": "A low sweep from negativa: the extended leg hooks behind the opponent's support foot and pulls it away. Train it on a partner's ankle or a cone.", "cues": ["Enter low in negativa beside the opponent's foot.", "Hook with the foot or ankle, pull toward you.", "Keep your hand on the floor and the guard up."], "mistakes": ["Kicking the ankle instead of hooking.", "Coming in standing up."], "drills": ["Negativa slides to a cone, 8 per side.", "Rasteira on a cone or water bottle.", "Ginga - esquiva - rasteira counter combo."], "alt": "Practise only the entry into negativa."}, {"id": "tesoura", "name": "Tesoura", "cat": "atk", "lvl": 2, "en": "Scissors", "what": "A takedown where you trap the opponent's legs between yours from a low position. Train the entry solo and the finish only with a willing partner on a mat.", "cues": ["Enter low from negativa or an aú.", "Legs close like scissors at knee height.", "Turn the hips to finish."], "mistakes": ["Diving in head first.", "Twisting a partner's knee - always go slowly."], "drills": ["Tesoura entry shapes in the air, 6 per side.", "Tesoura on a rolled mat.", "Tesoura from aú (advanced)."], "alt": "Solo shapes only."}, {"id": "vingativa", "name": "Vingativa", "cat": "atk", "lvl": 2, "en": "The revenge", "what": "A hip throw from a low position: you step behind the opponent's leg and push them back over it with your body.", "cues": ["Step deep beside and behind their leg.", "Shoulder and hip drive back and across."], "mistakes": ["Standing too far away.", "Pushing with the arms only."], "drills": ["Shadow vingativa entry, 8 per side.", "Vingativa on a heavy bag or partner, slowly."], "alt": "Solo entry only."}, {"id": "pulada", "name": "Armada pulada", "cat": "atk", "lvl": 3, "en": "Jumping armada", "what": "A jumping version of the armada: take off during the spin and kick in the air, landing on the kicking leg or both feet.", "cues": ["Fast, clean armada first.", "Drive the knee of the free leg up to lift.", "Spot the landing, land soft in ginga."], "mistakes": ["Jumping without enough rotation.", "Landing with straight knees."], "drills": ["Armada with a small hop.", "Spin jumps (360) landing balanced.", "Full armada pulada on grass."], "alt": "Fast standing armada.", "pre": "armada"}, {"id": "martelo_rodado", "name": "Martelo rodado", "cat": "atk", "lvl": 3, "en": "Spinning hammer", "what": "A jumping spinning martelo: spin like an armada, then whip the other leg round like a martelo in the air.", "cues": ["Strong armada-style spin.", "Switch legs in the air - the second leg kicks.", "Land on the kicking leg first."], "mistakes": ["Not enough height.", "Kicking with the wrong leg."], "drills": ["360 jumps with knee lift.", "Armada + martelo combo without the jump.", "Martelo rodado on grass."], "alt": "Armada + martelo on the ground.", "pre": "armada"}, {"id": "parafuso", "name": "Parafuso", "cat": "atk", "lvl": 3, "en": "The screw", "what": "A jumping spinning kick on a vertical axis: you take off out of a turn, spin in the air and whip the leg round at the top - the big brother of the martelo rodado. (The horizontal, B-twist-like aerial is the S-dobrado, in Acrobacias.)", "cues": ["Wind up with a step across and a strong arm swing in the direction of the spin.", "Jump straight up - the body stays vertical.", "Spot the target over the shoulder, then whip the kicking leg through.", "Land on the kicking leg, soft knee."], "mistakes": ["Leaning or traveling sideways in the air.", "Weak arm swing, so not enough rotation."], "drills": ["360 spin jumps landing balanced.", "Martelo rodado clean on both sides.", "Parafuso on grass, low then full height."], "alt": "Martelo rodado.", "pre": "martelo_rodado"}, {"id": "cabecada", "name": "Cabeçada", "cat": "atk", "lvl": 1, "en": "Headbutt", "what": "A head strike to the chest from a low entry. Practised solo or on a bag to learn the entry - never with full contact on a partner.", "cues": ["Lower the body and step in.", "Neck locked, strike with the top of the forehead.", "Arms guard the face."], "mistakes": ["Leading with the face.", "Loose neck."], "drills": ["Entry drill from ginga, 8 reps.", "Cabeçada on a pad or bag, light."], "alt": "Entry footwork only."}, {"id": "esq_lateral", "name": "Esquiva lateral", "cat": "def", "lvl": 1, "en": "Side dodge", "what": "Drop sideways and low, with one hand on the floor and the guard arm up, letting a circular kick pass over.", "cues": ["Step to the side and bend the knee on that side.", "Hand on the floor beside the foot, other arm guarding.", "Eyes on the kick."], "mistakes": ["Staying too high.", "Turning the back."], "drills": ["Ginga to esquiva lateral 10 per side.", "Esquiva + return to ginga in rhythm.", "Esquiva lateral against a partner's slow meia-lua."], "alt": "Smaller dodge with hands on knees.", "defends": ["meialua_frente", "armada", "queixada", "compasso"]}, {"id": "esq_baixa", "name": "Esquiva baixa", "cat": "def", "lvl": 1, "en": "Low dodge", "what": "From the ginga, drop low with the chest forward over the front leg and the arm protecting the head.", "cues": ["Lower over the front leg, chest low.", "Back leg extended behind.", "Hand guards the head."], "mistakes": ["Bending the back without bending the legs."], "drills": ["Ginga to esquiva baixa, 10 per side.", "Esquiva baixa + armada counter."], "alt": "Higher dodge.", "defends": ["armada", "compasso", "martelo"]}, {"id": "esq_frente", "name": "Esquiva de frente", "cat": "def", "lvl": 1, "en": "Front dodge", "what": "Duck forward and down, under a kick coming straight or high, ready to counter.", "cues": ["Bend forward from the hips with bent knees.", "Both arms guarding.", "Come out ready to strike or roll."], "mistakes": ["Looking at the floor.", "Locked knees."], "drills": ["Ginga + duck 10 reps.", "Duck + cabeçada entry."], "alt": "Smaller duck.", "defends": ["bencao", "martelo", "queixada"]}, {"id": "cocorinha_def", "name": "Cocorinha (defesa)", "cat": "def", "lvl": 1, "en": "Squat dodge", "what": "Using the cocorinha as a defense: drop straight down under a high kick with the arm guarding the head.", "cues": ["Drop fast, heels down.", "Guard arm high.", "Spring back to ginga."], "mistakes": ["Late drop.", "Leaning back."], "drills": ["Partner or shadow: kick passes, you drop, 10 reps.", "Cocorinha + rasteira counter."], "alt": "Half squat.", "defends": ["armada", "meialua_frente"]}, {"id": "negativa_def", "name": "Negativa (defesa)", "cat": "def", "lvl": 1, "en": "Negative as defense", "what": "Going to negativa to escape a kick, leaving you low and ncao", "martelo", "chapa"]}, {"id": "contra", "name": "Esquiva + contra-ataque", "cat": "def", "lvl": 2, "en": "Dodge and counter", "what": "The real goal of defense: every esquiva flows into an attack. Classic pairs: esquiva lateral - meia-lua de compasso; cocorinha - rasteira; negativa - rolê - armada.", "cues": ["Never freeze in the defense.", "Counter with the leg that is already loaded.", "Stay low until the attacker's leg passes."], "mistakes": ["Coming up too early.", "Counter-attacking from a position with no balance."], "drills": ["Pairs drill: 5 reps of each defense-counter pair.", "Shadow game 2 x 2 min.", "Partner game at slow speed."], "alt": "Do the pairs separately at slow speed.", "defends": ["meialua_frente", "armada", "queixada", "compasso", "martelo"]}, {"id": "queda_rins", "name": "Queda de rins", "cat": "flo", "lvl": 1, "en": "Kidney drop", "what": "A low balance on one or both hands with the elbow tucked into the side of the waist and the legs off the floor, head close to the ground. A pause between movements and a base for many floreios.", "cues": ["Elbow into the hip bone, just below the ribs.", "Head on or near the floor as a third point at first.", "Legs tucked, then extended."], "mistakes": ["Elbow sliding onto the stomach.", "All weight on the head."], "drills": ["Tripod with head down, 3 x 15 s.", "Queda de rins legs tucked, 3 x 10 s per side.", "Queda de rins legs extended.", "Queda de rins from ginga and back."], "alt": "Keep the head on the floor and toes on the floor."}, {"id": "bananeira", "name": "Bananeira", "cat": "flo", "lvl": 1, "en": "Handstand", "what": "The capoeira handstand - more alive than the gym version, with bent legs, walking and looking forward. Your strong handstand makes this an early win.", "cues": ["Look forward at the opponent, not at the floor.", "Legs can be bent or open - stay balanced.", "Walk in all directions."], "mistakes": ["Gym-perfect line but no awareness of the opponent."], "drills": ["Bananeira walk 3 x 5 m.", "Bananeira with leg shapes (open, stag, bent).", "Bananeira to queda de rins."], "alt": "Wall walk or crow."}, {"id": "au_fechado", "name": "Aú fechado", "cat": "flo", "lvl": 1, "en": "Closed cartwheel", "what": "A slow aú with legs bent and tucked, staying protected; often paused in the middle like a handstand.", "cues": ["Knees bent and close together.", "Pause over the hands.", "Eyes forward."], "mistakes": ["Rushing.", "Legs opening wide."], "drills": ["Slow aú fechado with 2 s pause, 6 per side.", "Aú fechado to queda de rins."], "alt": "Low aú."}, {"id": "au_cabeca", "name": "Aú de cabeça", "cat": "flo", "lvl": 2, "en": "Head cartwheel", "what": "A cartwheel that goes through a headstand - the head stays on the floor as the legs pass over.", "cues": ["Triangle base: head and both hands.", "Legs pass slowly over the top.", "Strong neck, most weight on the hands."], "mistakes": ["All weight on the head.", "Rolling over the neck."], "drills": ["Tripod headstand holds 3 x 20 s.", "Tripod leg passes, half way, 6 per side.", "Full aú de cabeça."], "alt": "Tripod headstand only."}, {"id": "piao_cabeca", "name": "Pião de cabeça", "cat": "flo", "lvl": 2, "en": "Head spin", "what": "A spin on the head from a tripod position, legs open. Use a cap or beanie and a smooth floor.", "cues": ["Tripod base, push with hands to spin.", "Legs open wide to keep balance.", "Short spins at first."], "mistakes": ["Spinning on the neck.", "Hard floor and no head protection."], "drills": ["Tripod holds with legs open.", "Quarter turns pushing with the hands.", "2-3 spins."], "alt": "Tripod with leg shapes."}, {"id": "au_batido", "name": "Aú batido", "cat": "flo", "lvl": 2, "en": "Kicking cartwheel", "what": "A one-handed aú paused in the middle with a kick from the top leg (like a chapa or a hammer). Builds the one-arm support used for advanced floreios.", "cues": ["One-arm support, shoulder over the hand.", "Top leg kicks while the bottom leg balances.", "Return to the floor softly."], "mistakes": ["Collapsed shoulder.", "Kicking too early."], "drills": ["One-handed aú, 6 per side.", "Aú paused on one hand, 3 x 5 s per side.", "Full aú batido."], "alt": "One-handed aú without the kick."}, {"id": "macaco", "name": "Macaco", "cat": "flip", "lvl": 2, "en": "Monkey flip", "what": "A back walkover from a low squat over one hand: sit back, reach one arm behind, push from the legs and bring the hips over. You listed this as hard - it's built step by step over the program.", "cues": ["Start low on one hand behind you, opposite arm over the head.", "Push the hips up hard from the legs.", "Head looks back toward the hand.", "Second hand and feet land in a squat."], "mistakes": ["Not enough hip drive.", "Throwing the head before the hips.", "Hand placed too far behind."], "drills": ["Queda de quatro to bridge push, 3 x 8.", "Macaco over a rolled mat or a sofa back.", "Spotted macaco on grass.", "Macaco from cocorinha."], "alt": "Hips-up bridge push from queda de quatro."}, {"id": "au_quebrado", "name": "Aú quebrado", "cat": "flo", "lvl": 3, "en": "Broken cartwheel", "what": "A one-arm hand-balance where the body bends (arches) and the legs drop behind the head, held on the elbow in the side like a queda de rins in the air. Advanced and very shoulder-dependent.", "cues": ["Elbow into the side like queda de rins.", "Arch the back and drop the legs over.", "Eyes on the floor ahead."], "mistakes": ["Forcing the back without shoulder opening."], "drills": ["Queda de rins legs extended long holds.", "Queda de rins to arch shape.", "Aú quebrado held 3 s."], "alt": "Queda de rins with leg shapes.", "pre": "queda_rins"}, {"id": "piao_mao", "name": "Pião de mão", "cat": "flo", "lvl": 3, "en": "Hand spin", "what": "Spinning on one hand in a bent-arm or straight-arm one-hand balance - your one-arm handstand work feeds this directly.", "cues": ["Hand turned out, fingers spread.", "Legs open for balance and rotation.", "Spin with the hips, not the arm."], "mistakes": ["Spinning from the shoulder."], "drills": ["One-hand queda de rins, 3 x 5 s.", "Quarter turns on one hand.", "Full turn."], "alt": "Two-hand pião (shuffle hands).", "pre": "au_batido"}, {"id": "relogio", "name": "Relógio", "cat": "flo", "lvl": 3, "en": "The clock", "what": "A spin on one hand in queda de rins position, body horizontal, rotating like a clock hand.", "cues": ["Strong queda de rins with legs extended.", "Push the floor with the free hand to start.", "Head off the floor."], "mistakes": ["Dropping the hips."], "drills": ["Queda de rins head off the floor.", "Queda de rins quarter turns.", "Full relógio."], "alt": "Queda de rins hold.", "pre": "queda_rins"}, {"id": "jump_tuck", "name": "Salto grupado", "cat": "flip", "lvl": 1, "en": "Tuck jump base", "what": "The jumping base for all flips: maximal vertical jump with a fast knee tuck, landing soft.", "cues": ["Arms swing up hard.", "Knees to chest at the top.", "Land with bent knees and quiet feet."], "mistakes": ["Jumping forward instead of up.", "Hard landings."], "drills": ["Tuck jumps 3 x 6.", "Tuck jumps from a deep squat.", "Tuck jump with half turn."], "alt": "Squat jumps."}, {"id": "au_uma_mao", "name": "Aú de uma mão", "cat": "flip", "lvl": 1, "en": "One-handed cartwheel", "what": "An aú placing only the far hand - the step toward the aú sem mão.", "cues": ["Strong kick of the back leg.", "Far hand only, close to the front foot.", "Chest stays up."], "mistakes": ["Hand too far away."], "drills": ["Low one-hand aú 6 per side.", "Fast one-hand aú.", "One-hand aú with fingertips only."], "alt": "Normal aú."}, {"id": "macaco_pe", "name": "Macaco em pé", "cat": "flip", "lvl": 2, "en": "Standing macaco", "what": "The macaco starting from standing: you sit back into a low squat with the hand already reaching and flow straight into the walkover.", "cues": ["Clean macaco first.", "Sit back fast and keep looking at the hand.", "Strong hip drive."], "mistakes": ["Stopping at the bottom."], "drill }]}], "schedule": "3 sessions a week of about 60-75 minutes (A, B, C), on non-consecutive days or on your movement day + two sessions slotted after your usual training. Add 10 minutes of ginga on any other day. Each session: warm-up (10 min) - skill blocks (35-45 min) - combos (10 min) - conditioning (8 min) - cool-down (5 min).", "safety": ["Train acrobatics on grass or a thick mat, never on a hard floor, and never at the end of a hard leg day.", "First full attempts of macaco, aú sem mão, mortal, folha seca and S-dobrado: have a spotter, ideally a capoeira or acrobatics coach.", "Kicks are trained with control: full speed only into the air, a bag or a held target - never into a partner.", "Takedowns (rasteira, tesoura, vingativa) and cabeçada are trained solo or slowly with a willing partner on a mat.", "Head floreios (aú de cabeça, pião de cabeça): most weight on the hands, a beanie or cap for spins, stop at any neck pain.", "If something hurts (wrists, neck, lower back), use the easier option listed with each move."], "sources": [{"author": "Mestre Bimba (Manoel dos Reis Machado)", "works": ["Sequências de Ensino da Capoeira Regional"]}, {"author": "Mestre Pastinha (Vicente Ferreira Pastinha)", "works": ["Capoeira Angola (1964)"]}, {"author": "Nestor Capoeira", "works": ["The Little Capoeira Book", "Capoeira: Roots of the Dance-Fight-Game"]}, {"author": "Mestre Acordeon (Bira Almeida)", "works": ["Capoeira: A Brazilian Art Form"]}], "aiNote": "This app and manual were created with the help of AI (Claude by Anthropic). They don't replace a capoeira teacher - join a roda whenever you can."}, "pt": {"cats": [{"id": "fund", "name": "Fundamentos", "en": "Fundamentos", "color": "#f5c542", "intro": "Ginga, as posições baixas e as fugas pelo chão. Tudo na capoeira nasce daqui, por isso voltam em todas as sessões do programa."}, {"id": "atk", "name": "Ataques", "en": "Ataques", "color": "#ff5a4e", "intro": "Chutes, rasteiras e quedas. Os chutes da capoeira são quase sempre circulares e saem da ginga; treine-os primeiro devagar e controlados, depois com velocidade."}, {"id": "def", "name": "Defesas", "en": "Defesas", "color": "#4ea8ff", "intro": "A capoeira se defende saindo do caminho (esquivas) e ficando baixo, raramente bloqueando. Uma boa defesa sempre termina numa posição de onde você pode contra-atacar."}, {"id": "flo", "name": "Floreios", "en": "Floreios", "color": "#b36bff", "intro": "Movimentos de equilíbrio nas mãos e de giro, usados para mostrar habilidade, mudar de nível e fluir entre ataques. Sua base de parada de mão te dá uma grande vantagem aqui."}, {"id": "flip", "name": "Acrobacias", "en": "Acrobacias", "color": "#3fd18b", "intro": "Movimentos aéreos e de reversão. Treine na grama ou num colchão grosso, nunca cansado, e com alguém ajudando nas primeiras tentativas completas. Cada um indica o movimento que você deve dominar antes."}], "levels": {"1": "Iniciante", "2": "Intermediário", "3": "Avançado"}, "moves": [{"id": "ginga", "name": "Ginga", "cat": "fund", "lvl": 1, "en": "O balanço", "what": "O passo de balanço constante da capoeira: um passo em triângulo de um lado para o outro, uma perna atrás de cada vez, o braço oposto protegendo o rosto. Mantém você em movimento, esconde o próximo golpe e prepara cada chute e cada fuga.", "cues": ["Pés na largura dos ombros; o pé de trás vai na diagonal para trás, nunca reto.", "Joelhos flexionados o tempo todo - a cabeça não deve subir e descer.", "O braço do lado da perna da frente cruza na frente do rosto.", "Peito um pouco à frente sobre o joelho da frente; peso na ponta dos pés."], "mistakes": ["Ficar alto e de pernas duras.", "Dar o passo reto para trás, deixando a base estreita.", "Baixar o braço de guarda.", "Olhar para o chão."], "drills": ["Triângulo parado: pise em cada canto e segure 3 s.", "Ginga lenta em 4 tempos, 2 minutos.", "Ginga com base mais larga e baixa (coxas quase paralelas).", "Ginga em círculo, mudando o ritmo (lento, rápido, quebrado)."], "alt": "Passo mais curto e base mais alta até as pernas se adaptarem."}, {"id": "cocorinha", "name": "Cocorinha", "cat": "fund", "lvl": 1, "en": "Agachadinha", "what": "Um agachamento completo com os calcanhares no chão e um braço protegendo a cabeça. A primeira defesa contra chutes altos e a posição de baixo para muitas transições.", "cues": ["Calcanhares no chão, joelhos para fora sobre os pés.", "Braço de guarda dobrado acima da cabeça, a outra mão pode tocar o chão.", "Olhos no oponente - cabeça erguida."], "mistakes": ["Calcanhares levantando.", "Enfiar a cabeça entre os joelhos.", "Cair para a frente sobre as mãos."], "drills": ["Agachamento profundo parado, 3 x 30 s.", "Ginga para cocorinha e volta, 10 de cada lado.", "Cocorinha andando - desloque-se de lado ficando baixo."], "alt": "Calcanhares sobre uma cunha ou anilha até a mobilidade do tornozelo melhorar."}, {"id": "negativa", "name": "Negativa", "cat": "fund", "lvl": 1, "en": "A negativa", "what": "Uma posição baixa sobre uma perna flexionada com a outra esticada no chão, uma mão no chão e a outra protegendo o rosto. Uma defesa, uma base no chão e o início do rolê e da rasteira.", "cues": ["Perna de apoio totalmente flexionada, pé no chão.", "Perna esticada reta, pé flexionado, apoiado no calcanhar ou na lateral do pé.", "Mão de apoio ao lado do quadril, não atrás de você.", "Peito virado para a perna esticada, braço de guarda em cima."], "mistakes": ["Sentar no chão.", "Mão muito para trás, abrindo o peito para o céu.", "Perna esticada dobrada."], "drills": ["Ginga para negativa, 8 por lado, devagar.", "Troca de negativa: passe de um lado para o outro ficando baixo.", "Fluxo negativa - rolê - ginga."], "alt": "Coloque a mão num bloco de yoga para elevar o chão."}, {"id": "role", "name": "Rolê", "cat": "fund", "lvl": 1, "en": "A rolagem", "what": "Um deslocamento baixo girando sobre mãos e pés, usado para fugir e mudar de lado. Da negativa você gira sobre as duas mãos e volta de frente para o oponente.", "cues": ["As duas mãos apoiadas, quadril baixo.", "Gire a cabeça primeiro, o quadril vem depois.", "Termine em negativa ou ginga, de frente."], "mistakes": ["Quadril alto demais (vira um andar de urso).", "Perder o oponente de vista por tempo demais."], "drills": ["Rolê a partir da negativa, 6 para cada lado.", "Sequência de rolês atravessando a sala, ida e volta.", "Rolê para aú."], "alt": "Faça o giro em dois tempos: primeiro as mãos, depois os pés."}, {"id": "au", "name": "Aú", "cat": "fund", "lvl": 1, "en": "Estrela da capoeira", "what": "Uma estrela com os olhos no oponente, pernas passando um pouco dobradas ou abertas, muitas vezes mais lenta e controlada que a estrela da ginástica. Usada para entrar e sair do jogo.", "cues": ["Olhe entre as mãos, para onde o oponente estaria, não para o chão.", "As mãos apoiam uma depois da outra, em linha.", "Pernas bem abertas lá em cima, pontas dos pés ativas.", "Aterrisse em ginga ou negativa, pronto."], "mistakes": ["Olhar para o chão.", "Fechar o quadril, e o aú vira um pulinho.", "Aterrissar em pé, com os pés chapados."], "drills": ["Aú baixo com pernas dobradas sobre uma linha.", "Aú para a esquerda e a direita, 6 de cada.", "Aú lento com pausa de 1 s nas mãos.", "Aú para negativa."], "alt": "Aú baixo de pernas dobradas ou passagem lateral das pernas."}, {"id": "queda4", "name": "Queda de quatro", "cat": "fund", "lvl": 1, "en": "Queda de quatro", "what": "Cair para trás sentando com as mãos atrás e os pés na frente - uma fuga de emergência e a base do macaco.", "cues": ["As mãos apoiam atrás do quadril, dedos para fora ou para trás.", "Quadril fora do chão.", "Volte passando pela cocorinha ou por um rolê."], "mistakes": ["Cotovelos travados na queda.", "Sentar totalmente."], "drills": ["Agachamento para queda de quatro, 10 repetições.", "Queda de quatro andando para a frente e para trás.", "Queda de quatro para empurrar em ponte (preparação do macaco)."], "alt": "Desça devagar a partir do agachamento em vez de cair."}, {"id": "ponte", "name": "Ponte", "cat": "fund", "lvl": 2, "en": "Ponte", "what": "A extensão para trás que abre ombros e coluna para o macaco, o aú de cabeça e as reversões. Tratada aqui como uma habilidade diária de mobilidade.", "cues": ["Empurre o chão até os braços ficarem esticados.", "Ombros sobre os punhos, não atrás deles.", "Contraia levemente os glúteos, joelhos alinhados com os pés."], "mistakes": ["Dobrar só na lombar.", "Pés muito abertos para fora."], "drills": ["Deslizamento na parede com braços acima da cabeça, 2 x 10.", "Ponte parada 3 x 20 s, pés num degrau se precisar.", "Balanço na ponte (ombros sobre as mãos).", "Descer em ponte pela parede."], "alt": "Ponte com pés elevados ou posição de mesa."}, {"id": "meialua_frente", "name": "Meia-lua de frente", "cat": "atk", "lvl": 1, "en": "Meia-lua de frente", "what": "Um chute circular de fora para dentro com a perna esticada, na frente do corpo. Normalmente o primeiro chute ensinado.", "cues": ["O chute sai da perna de trás da ginga.", "Perna esticada, círculo de fora para dentro na altura da cabeça.", "O calcanhar de apoio gira um pouco; a guarda fica em cima.", "Volte para a ginga - não deixe a perna cair e ficar."], "mistakes": ["Dobrar o joelho.", "Inclinar muito para trás.", "Chutar sem voltar para a ginga."], "drills": ["Chutes em câmera lenta tocando uma mão na altura do ombro.", "10 por lado a partir da ginga.", "Meia-lua dupla (uma com cada perna) no ritmo."], "alt": "Altura menor (cintura) até a mobilidade do quadril permitir mais."}, {"id": "queixada", "name": "Queixada", "cat": "atk", "lvl": 1, "en": "Chute no queixo", "what": "Um chute circular de dentro para fora: você cruza o pé da frente, gira o quadril e a perna de trás circula para fora.", "cues": ["Dê o passo na diagonal para fechar o quadril primeiro.", "A perna que chuta sobe cruzando o corpo e abre para fora.", "O tronco inclina um pouco para o outro lado como contrapeso."], "mistakes": ["Sem passo - chutar de base quadrada.", "Balançar os braços sem controle."], "drills": ["Passo + segurar a posição, depois chutar devagar.", "8 por lado a partir da ginga.", "Queixada para esquiva lateral."], "alt": "Versão com joelho dobrado na altura da cintura."}, {"id": "armada", "name": "Armada", "cat": "atk", "lvl": 1, "en": "Chute giratório", "what": "Um chute giratório de fora: cruze o passo, vire as costas por um instante, olhe por cima do ombro e varra com a perna esticada.", "cues": ["Cruze o pé da frente e gire na ponta dos pés.", "Cabeça e olhos giram primeiro - encontre o alvo por cima do ombro.", "Perna que chuta esticada, quadril reto.", "Termine de frente, na ginga."], "mistakes": ["Girar às cegas (perna antes dos olhos).", "Perder o equilíbrio no giro.", "Chute baixo demais e dobrado."], "drills": ["Giro sem chutar, 10 de cada lado.", "Armada tocando um alvo (mão/saco).", "Armada para negativa."], "alt": "Meio giro sem esticar toda a perna."}, {"id": "bencao", "name": "Bênção", "cat": "atk", "lvl": 1, "en": "Bênção / chute frontal de empurrar", "what": "Um chute reto de empurrar com a sola do pé no peito ou na barriga, afastando o oponente.", "cues": ["Levante o joelho primeiro, depois empurre com o calcanhar.", "O quadril empurra para a frente no final.", "Recolha a perna de volta para a ginga."], "mistakes": ["Estalar a perna (é um empurrão, não uma chicotada).", "Inclinar demais para trás."], "drills": ["Levantar o joelho + estender devagar, 8 por lado.", "Bênção na parede ou no saco.", "Bênção, passo à frente e ginga."], "alt": "Alvo mais baixo."}, {"id": "martelo", "name": "Martelo", "cat": "atk", "lvl": 2, "en": "Chute martelo", "what": "Um chute semicircular que acerta com o peito do pé - rápido e direto, mais parecido com um chute de arte marcial do que com os chutes circulares da capoeira.", "cues": ["Gire o pé de apoio.", "O joelho sobe e cruza, depois a canela estala.", "Guarda em cima, olhos no alvo."], "mistakes": ["Não girar o pé de apoio (força o joelho).", "Baixar a guarda."], "drills": ["Armar + estender devagar, 6 por lado.", "Martelo no saco ou num alvo segurado.", "Escada de martelo baixo-médio-alto."], "alt": "Martelo na altura do joelho."}, {"id": "chapa", "name": "Chapa", "cat": "atk", "lvl": 1, "en": "Chute lateral de empurrar", "what": "Um chute de empurrar lateral ou para trás com a sola do pé, muitas vezes de uma posição baixa ou de costas.", "cues": ["Arme o joelho em direção ao peito.", "Empurre o calcanhar para o lado, dedos levemente para baixo.", "Olhe por cima do ombro para o alvo."], "mistakes": ["Inclinar tanto que perde a guarda.", "Chutar com os dedos."], "drills": ["Armar + empurrar, 8 por lado.", "Chapa de costas a partir da ginga.", "Chapa baixa do chão (mãos no chão)."], "alt": "Mão na parede para equilíbrio."}, {"id": "compasso", "name": "Meia-lua de compasso", "cat": "atk", "lvl": 2, "en": "Meia-lua de compasso", "what": "O chute símbolo da capoeira: as mãos vão ao chão e você gira, varrendo o calcanhar num grande arco. Também chamado rabo de arraia.", "cues": ["Cruze o passo, as duas mãos no chão ao lado do pé da frente.", "Olhe o alvo por baixo do braço durante todo o giro.", "O calcanhar conduz, perna esticada, quadril gira por completo.", "Termine na ginga, guarda em cima."], "mistakes": ["Perder o alvo de vista.", "Mãos longe demais do pé.", "Dobrar a perna que chuta."], "drills": ["Posição com mãos no chão + giro lento.", "Compasso num alvo na altura da cintura.", "Compasso em velocidade máxima, 6 por lado.", "Compasso para rolê."], "alt": "Chute mais baixo e giro mais lento."}, {"id": "rasteira", "name": "Rasteira", "cat": "atk", "lvl": 2, "en": "Rasteira", "what": "Uma varrida baixa a partir da negativa: a perna esticada engancha atrás do pé de apoio do oponente e o puxa. Treine no tornozelo de um parceiro ou num cone.", "cues": ["Entre baixo em negativa ao lado do pé do oponente.", "Enganche com o pé ou o tornozelo e puxe para você.", "Mantenha a mão no chão e a guarda em cima."], "mistakes": ["Chutar o tornozelo em vez de enganchar.", "Entrar em pé."], "drills": ["Negativa deslizando até um cone, 8 por lado.", "Rasteira num cone ou numa garrafa de água.", "Combinação ginga - esquiva - rasteira de contra-ataque."], "alt": "Pratique só a entrada na negativa."}, {"id": "tesoura", "name": "Tesoura", "cat": "atk", "lvl": 2, "en": "Tesoura", "what": "Uma queda em que você prende as pernas do oponente entre as suas a partir de uma posição baixa. Treine a entrada sozinho e a finalização só com um parceiro disposto, num colchão.", "cues": ["Entre baixo a partir da negativa ou de um aú.", "As pernas fecham como uma tesoura na altura do joelho.", "Gire o quadril para finalizar."], "mistakes": ["Entrar de cabeça.", "Torcer o joelho do parceiro - sempre devagar."], "drills": ["Formas da entrada da tesoura no ar, 6 por lado.", "Tesoura num colchão enrolado.", "Tesoura a partir do aú (avançado)."], "alt": "Só as formas, sozinho."}, {"id": "vingativa", "name": "Vingativa", "cat": "atk", "lvl": 2, "en": "A vingança", "what": "Uma projeção de quadril de posição baixa: você pisa atrás da perna do oponente e o empurra para trás por cima dela com o corpo.", "cues": ["Pise fundo ao lado e atrás da perna dele.", "Ombro e quadril empurram para trás e cruzando."], "mistakes": ["Ficar longe demais.", "Empurrar só com os braços."], "drills": ["Entrada da vingativa no ar, 8 por lado.", "Vingativa num saco pesado ou num parceiro, devagar."], "alt": "Só a entrada, sozinho."}, {"id": "pulada", "name": "Armada pulada", "cat": "atk", "lvl": 3, "en": "Armada pulada", "what": "Uma versão pulada da armada: decole durante o giro e chute no ar, aterrissando na perna que chutou ou nos dois pés.", "cues": ["Primeiro uma armada rápida e limpa.", "Leve o joelho da perna livre para cima para subir.", "Encontre o chão com os olhos, aterrisse suave na ginga."], "mistakes": ["Pular sem giro suficiente.", "Aterrissar com os joelhos esticados."], "drills": ["Armada com um pulinho.", "Pulos com giro (360) aterrissando equilibrado.", "Armada pulada completa na grama."], "alt": "Armada rápida em pé.", "pre": "armada"}, {"id": "martelo_rodado", "name": "Martelo rodado", "cat": "atk", "lvl": 3, "en": "Martelo giratório", "what": "Um martelo pulado e giratório: gire como numa armada e depois chicoteie a outra perna como um martelo no ar.", "cues": ["Giro forte, estilo armada.", "Troque as pernas no ar - a segunda perna chuta.", "Aterrisse primeiro na perna que chutou."], "mistakes": ["Pouca altura.", "Chutar com a perna errada."], "drills": ["Pulos de 360 com elevação do joelho.", "Combinação armada + martelo sem pulo.", "Martelo rodado na grama."], "alt": "Armada + martelo no chão.", "pre": "armada"}, {"id": "parafuso", "name": "Parafuso", "cat": "atk", "lvl": 3, "en": "O parafuso", "what": "Um chute pulado e giratório num eixo vertical: você decola de um giro, gira no ar e chicoteia a perna lá em cima - o irmão mais velho do martelo rodado. (A acrobacia horizontal, parecida com o B-twist, é o S-dobrado, em Acrobacias.)", "cues": ["Prepare com um passo cruzado e um forte balanço dos braços no sentido do giro.", "Pule reto para cima - o corpo fica vertical.", "Encontre o alvo por cima do ombro e chicoteie a perna.", "Aterrisse na perna que chutou, joelho macio."], "mistakes": ["Inclinar ou se deslocar de lado no ar.", "Balanço de braços fraco, com pouca rotação."], "drills": ["Pulos com giro de 360 aterrissando equilibrado.", "Martelo rodado limpo dos dois lados.", "Parafuso na grama, baixo e depois na altura total."], "alt": "Martelo rodado.", "pre": "martelo_rodado"}, {"id": "cabecada", "name": "Cabeçada", "cat": "atk", "lvl": 1, "en": "Cabeçada", "what": "Um golpe de cabeça no peito a partir de uma entrada baixa. Praticado sozinho ou no saco para aprender a entrada - nunca com contato total num parceiro.", "cues": ["Abaixe o corpo e entre.", "Pescoço firme, acerte com o alto da testa.", "Braços protegem o rosto."], "mistakes": ["Entrar com o rosto na frente.", "Pescoço solto."], "drills": ["Exercício de entrada a partir da ginga, 8 repetições.", "Cabeçada leve num aparador ou saco."], "alt": "Só o trabalho de pés da entrada."}, {"id": "esq_lateral", "name": "Esquiva lateral", "cat": "def", "lvl": 1, "en": "Esquiva lateral", "what": "Desça de lado e baixo, com uma mão no chão e o braço de guarda em cima, deixando um chute circular passar por cima.", "cues": ["Dê um passo para o lado e flexione o joelho desse lado.", "Mão no chão ao lado do pé, o outro braço protegendo.", "Olhos no chute."], "mistakes": ["Ficar alto demais.", "Virar as costas."], "drills": ["Ginga para esquiva lateral, 10 por lado.", "Esquiva + volta para a ginga no ritmo.", "Esquiva lateral contra a meia-lua lenta de um parceiro."], "alt": "Esquiva menor, mãos nos joelhos.", "defends": ["meialua_frente", "armada", "queixada", "compasso"]}, {"id": "esq_baixa", "name": "Esquiva baixa", "cat": "def", "lvl": 1, "en": "Esquiva baixa", "what": "Da ginga, desça com o peito à frente sobre a perna da frente e o braço protegendo a cabeça.", "cues": ["Desça sobre a perna da frente, peito baixo.", "Perna de trás esticada para trás.", "A mão protege a cabeça."], "mistakes": ["Curvar as costas sem dobrar as pernas."], "drills": ["Ginga para esquiva baixa, 10 por lado.", "Esquiva baixa + contra-ataque de armada."], "alt": "Esquiva mais alta.", "defends": ["armada", "compasso", "martelo"]}, {"id": "esq_frente", "name": "Esquiva de frente", "cat": "def", "lvl": 1, "en": "Esquiva de frente", "what": "Abaixe-se para a frente e para baixo, por baixo de um chute reto ou alto, pronto para contra-atacar.", "cues": ["Incline para a frente a partir do quadril, joelhos dobrados.", "Os dois braços protegendo.", "Saia pronto para golpear ou rolar."], "mistakes": ["Olhar para o chão.", "Joelhos travados."], "drills": ["Ginga + abaixar, 10 repetições.", "Abaixar + entrada de cabeçada."], "alt": "Abaixar menos.", "defends": ["bencao", "martelo", "queixada"]}, {"id": "cocorinha_def", "name": "Cocorinha (defesa)", "cat": "def", "lvl": 1, "en": "Esquiva de cocorinha", "what": "A cocorinha como defesa: desça reto por baixo de um chute alto com o braço protegendo a cabeça.", "cues": ["Desça rápido, calcanhares no chão.", "Braço de guarda alto.", "Volte com impulso para a ginga."], "mistakes": ["Descer atrasado.", "Inclinar para trás."], "drills": ["Com parceiro ou sozinho: o chute passa, você desce, 10 repetições.", "Cocorinha + contra-ataque de rasteira."], "alt": "Meio agachamento.", "defends": ["armada", "meialua_frente"]}, {"id": "negativa_def", "name": "Negativa (defesa)", "cat": "def", "lvl": 1, "en": "Negativa como defesa", "what": "Ir para a negativa para fugir de um chute, ficando baixo e pronto para a rasteira ou o rolê.", "cues": ["Desça e estique a perna em direção ao atacante.", "Mão no chão, guarda em cima.", "Vire o peito para o atacante."], "mistakes": ["Terminar de costas para o atacante."], "drills": ["Ginga para negativa ao sinal, 10 repetições.", "Negativa + contra-ataque de rasteira."], "alt": "Negativa mais alta com um bloco sob a mão.", "defends": ["compasso", "armada", "martelo"]}, {"id": "role_def", "name": "Rolê (fuga)", "cat": "def", "lvl": 1, "en": "Fuga rolando", "what": "Rolar para longe da pressão pelo chão e voltar de frente para o oponente a uma distância segura.", "cues": ["Baixo e rápido.", "Olhe para trás rapidamente."], "mistakes": ["Rolar em direção ao atacante."], "drills": ["Fluxo negativa - rolê - ginga, 6 vezes.", "Rolê fugindo de um parceiro que empurra."], "alt": "Rolê lento.", "defends": ["bencao", "chapa"]}, {"id": "resistencia", "name": "Resistência", "cat": "def", "lvl": 2, "en": "Resistência", "what": "Uma defesa baixa com o corpo inclinado para trás e apoiado numa mão, perto do oponente, deixando o chute passar logo acima. Leva direto para a rasteira e a vingativa.", "cues": ["Quadril perto do chão, mão de apoio atrás.", "Corpo bem perto do atacante.", "Braço de guarda em cima."], "mistakes": ["Sentar.", "Inclinar tanto que não consegue voltar."], "drills": ["Resistência parada, 5 x 10 s por lado.", "Resistência para contra-ataque de rasteira.", "Resistência para entrada de vingativa."], "alt": "Esquiva lateral.", "defends": ["queixada", "armada", "martelo"]}, {"id": "cruz", "name": "Cruz / bloqueio", "cat": "def", "lvl": 2, "en": "Bloqueio", "what": "Uma defesa de bloqueio com os antebraços cruzados ou com um antebraço, usada só quando não dá para fugir de um chute reto e rápido.", "cues": ["Antebraços firmes, cotovelos dobrados.", "Bloqueie e gire o corpo para desviar, não para absorver."], "mistakes": ["Bloquear com as mãos abertas.", "Ficar parado depois do bloqueio."], "drills": ["Bloqueios no ar, 10 repetições.", "Bloqueios leves contra a bênção lenta de um parceiro."], "alt": "Esquive em vez disso.", "defends": ["bencao", "martelo", "chapa"]}, {"id": "contra", "name": "Esquiva + contra-ataque", "cat": "def", "lvl": 2, "en": "Esquiva e contra-ataque", "what": "O verdadeiro objetivo da defesa: cada esquiva flui para um ataque. Pares clássicos: esquiva lateral - meia-lua de compasso; cocorinha - rasteira; negativa - rolê - armada.", "cues": ["Nunca congele na defesa.", "Contra-ataque com a perna que já está carregada.", "Fique baixo até a perna do atacante passar."], "mistakes": ["Subir cedo demais.", "Contra-atacar de uma posição sem equilíbrio."], "drills": ["Exercício de pares: 5 repetições de cada par defesa-contra-ataque.", "Jogo sozinho 2 x 2 min.", "Jogo com parceiro em velocidade lenta."], "alt": "Faça os pares separados, em velocidade lenta.", "defends": ["meialua_frente", "armada", "queixada", "compasso", "martelo"]}, {"id": "queda_rins", "name": "Queda de rins", "cat": "flo", "lvl": 1, "en": "Queda de rins", "what": "Um equilíbrio baixo sobre uma ou as duas mãos, com o cotovelo encaixado na lateral da cintura e as pernas fora do chão, cabeça perto do chão. Uma pausa entre movimentos e base de muitos floreios.", "cues": ["Cotovelo no osso do quadril, logo abaixo das costelas.", "Cabeça no chão ou perto dele como terceiro ponto no início.", "Pernas encolhidas, depois esticadas."], "mistakes": ["O cotovelo escorregando para a barriga.", "Todo o peso na cabeça."], "drills": ["Tripé com a cabeça no chão, 3 x 15 s.", "Queda de rins de pernas encolhidas, 3 x 10 s por lado.", "Queda de rins de pernas esticadas.", "Queda de rins a partir da ginga e volta."], "alt": "Mantenha a cabeça e as pontas dos pés no chão."}, {"id": "bananeira", "name": "Bananeira", "cat": "flo", "lvl": 1, "en": "Parada de mão", "what": "A parada de mão da capoeira - mais viva que a da ginástica, com pernas dobradas, andando e olhando para a frente. Sua parada de mão forte faz disso uma vitória rápida.", "cues": ["Olhe para a frente, para o oponente, não para o chão.", "As pernas podem estar dobradas ou abertas - mantenha o equilíbrio.", "Ande em todas as direções."], "mistakes": ["Linha perfeita de ginástica, mas sem atenção ao oponente."], "drills": ["Andar de bananeira 3 x 5 m.", "Bananeira com formas de perna (aberta, estrela, dobrada).", "Bananeira para queda de rins."], "alt": "Subir na parede ou corvo."}, {"id": "au_fechado", "name": "Aú fechado", "cat": "flo", "lvl": 1, "en": "Aú fechado", "what": "Um aú lento com as pernas dobradas e encolhidas, ficando protegido; muitas vezes com pausa no meio como uma parada de mão.", "cues": ["Joelhos dobrados e juntos.", "Pausa sobre as mãos.", "Olhos para a frente."], "mistakes": ["Ter pressa.", "Pernas abrindo muito."], "drills": ["Aú fechado lento com pausa de 2 s, 6 por lado.", "Aú fechado para queda de rins."], "alt": "Aú baixo."}, {"id": "au_cabeca", "name": "Aú de cabeça", "cat": "flo", "lvl": 2, "en": "Aú de cabeça", "what": "Uma estrela que passa por uma parada de cabeça - a cabeça fica no chão enquanto as pernas passam por cima.", "cues": ["Base em triângulo: cabeça e as duas mãos.", "As pernas passam devagar por cima.", "Pescoço firme, a maior parte do peso nas mãos."], "mistakes": ["Todo o peso na cabeça.", "Rolar por cima do pescoço."], "drills": ["Parada de cabeça em tripé, 3 x 20 s.", "Passagens de perna em tripé, até a metade, 6 por lado.", "Aú de cabeça completo."], "alt": "Só a parada de cabeça em tripé."}, {"id": "piao_cabeca", "name": "Pião de cabeça", "cat": "flo", "lvl": 2, "en": "Pião de cabeça", "what": "Um giro sobre a cabeça a partir do tripé, pernas abertas. Use boné ou touca e um chão liso.", "cues": ["Base em tripé, empurre com as mãos para girar.", "Pernas bem abertas para manter o equilíbrio.", "Giros curtos no começo."], "mistakes": ["Girar sobre o pescoço.", "Chão duro e sem proteção na cabeça."], "drills": ["Tripé parado com as pernas abertas.", "Quartos de volta empurrando com as mãos.", "2-3 giros."], "alt": "Tripé com formas de perna."}, {"id": "au_batido", "name": "Aú batido", "cat": "flo", "lvl": 2, "en": "Aú batido", "what": "Um aú de uma mão com pausa no meio e um chute da perna de cima (como uma chapa ou um martelo). Constrói o apoio de um braço usado nos floreios avançados.", "cues": ["Apoio de um braço, ombro sobre a mão.", "A perna de cima chuta enquanto a de baixo equilibra.", "Volte ao chão suavemente."], "mistakes": ["Ombro afundado.", "Chutar cedo demais."], "drills": ["Aú de uma mão, 6 por lado.", "Aú parado numa mão, 3 x 5 s por lado.", "Aú batido completo."], "alt": "Aú de uma mão sem o chute."}, {"id": "macaco", "name": "Macaco", "cat": "flip", "lvl": 2, "en": "Macaco", "what": "Uma reversão para trás a partir de um agachamento baixo sobre uma mão: sente para trás, leve um braço para trás, empurre com as pernas e passe o quadril por cima. Você disse que este é difícil - ele é construído passo a passo ao longo do programa.", "cues": ["Comece baixo com uma mão atrás de você, o braço oposto por cima da cabeça.", "Empurre o quadril para cima com força a partir das pernas.", "A cabeça olha para trás, em direção à mão.", "A segunda mão e os pés aterrissam num agachamento."], "mistakes": ["Pouco impulso do quadril.", "Jogar a cabeça antes do quadril.", "Mão muito atrás."], "drills": ["Queda de quatro para empurrar em ponte, 3 x 8.", "Macaco por cima de um colchão enrolado ou do encosto de um sofá.", "Macaco com ajuda, na grama.", "Macaco a partir da cocorinha."], "alt": "Empurrar o quadril para cima em ponte a partir da queda de quatro."}, {"id": "au_quebrado", "name": "Aú quebrado", "cat": "flo", "lvl": 3, "en": "Aú quebrado", "what": "Um equilíbrio num braço em que o corpo arqueia e as pernas caem atrás da cabeça, apoiado no cotovelo na lateral como uma queda de rins no ar. Avançado e muito dependente dos ombros.", "cues": ["Cotovelo na lateral como na queda de rins.", "Arqueie as costas e deixe as pernas passarem.", "Olhos no chão à frente."], "mistakes": ["Forçar as costas sem abertura de ombros."], "drills": ["Queda de rins de pernas esticadas, segurando bastante.", "Queda de rins para a forma arqueada.", "Aú quebrado segurado 3 s."], "alt": "Queda de rins com formas de perna.", "pre": "queda_rins"}, {"id": "piao_mao", "name": "Pião de mão", "cat": "flo", "lvl": 3, "en": "Pião de mão", "what": "Girar sobre uma mão num equilíbrio de braço dobrado ou esticado - seu trabalho de parada de um braço alimenta isso diretamente.", "cues": ["Mão virada para fora, dedos abertos.", "Pernas abertas para equilíbrio e rotação.", "Gire com o quadril, não com o braço."], "mistakes": ["Girar a partir do ombro."], "drills": ["Queda de rins numa mão, 3 x 5 s.", "Quartos de volta numa mão.", "Volta completa."], "alt": "Pião com duas mãos (trocando as mãos).", "pre": "au_batido"}, {"id": "relogio", "name": "Relógio", "cat": "flo", "lvl": 3, "en": "O relógio", "what": "Um giro sobre uma mão em posição de queda de rins, corpo horizontal, girando como o ponteiro de um relógio.", "cues": ["Queda de rins forte com as pernas esticadas.", "Empurre o chão com a mão livre para começar.", "Cabeça fora do chão."], "mistakes": ["Deixar o quadril cair."], "drills": ["Queda de rins com a cabeça fora do chão.", "Quartos
