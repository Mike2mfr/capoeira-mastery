<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Capoeira Mastery</title>
<style>
:root{--bg:#000;--card:#111;--card2:#1a1a1a;--line:#262626;--txt:#f2f2f2;--mut:#9a9a9a;--acc:#f5c542;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
header{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:.5px}
header h1 span{color:var(--acc)}
header p{margin:2px 0 0;color:var(--mut);font-size:12px}
main{padding:16px 16px 100px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#0a0a0a;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .i{font-size:19px;line-height:1}
nav button.on{color:var(--acc)}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:15px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.mut{color:var(--mut)}.small{font-size:12.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
.btn{background:var(--acc);color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.lv{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.move{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.move:last-child{border-bottom:0}
.move b{font-weight:600}
.move .en{color:var(--mut);font-size:12.5px}
.done{color:var(--acc)}
ul{padding-left:18px;margin:6px 0}
li{margin:3px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--card);color:var(--mut);border:0;padding:8px 4px;font-size:12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#000;font-weight:700}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--acc)}
.blk{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.blk:last-child{border-bottom:0}
.blk .d{color:var(--acc);font-size:13px;text-align:right;max-width:48%}
.link{color:var(--txt);text-decoration:underline;text-decoration-color:#555;cursor:pointer}
.weeks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.weeks button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 0;font-size:13px;cursor:pointer;position:relative}
.weeks button.on{border-color:var(--acc);color:var(--acc);font-weight:700}
.weeks button.full::after{content:"";position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.tag{font-size:11px;color:#000;background:var(--acc);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:700}
.seq{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.seq span{background:var(--card2);border-radius:7px;padding:3px 8px;font-size:12.5px}
.seq span.arrow{background:none;color:var(--mut);padding:3px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
#sheet{background:#0d0d0d;border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;width:100%;max-width:720px;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
#sheet .x{float:right;background:var(--card2);border:0;color:var(--txt);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
label.chk{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0}
label.chk input{width:20px;height:20px;accent-color:var(--acc)}
.ai{font-size:12px;color:var(--mut);border-left:3px solid var(--acc);padding:6px 10px;margin-top:10px}
</style>
</head>
<body>
<header><h1>CAPOEIRA <span>MASTERY</span></h1><p id="sub">Basics · Offense · Defense · Floreios · Flips</p></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"><div id="sheet"></div></div>
<script>
const D = {"cats": [{"id": "fund", "name": "Basics", "en": "Fundamentos", "color": "#f5c542", "intro": "Ginga, the low positions and the ground escapes. Everything in capoeira grows out of these, so they come back in every session of the program."}, {"id": "atk", "name": "Offense", "en": "Ataques", "color": "#ff5a4e", "intro": "Kicks, sweeps and takedowns. Capoeira kicks are mostly circular and come out of the ginga; you train them slowly and controlled first, then with speed."}, {"id": "def", "name": "Defense", "en": "Defesas", "color": "#4ea8ff", "intro": "Capoeira defends by getting out of the way (esquivas) and staying low, rarely by blocking. A good defense always ends in a position you can counter from."}, {"id": "flo", "name": "Floreios", "en": "Flourishes", "color": "#b36bff", "intro": "Hand-balance and spinning movements used to show skill, to change level and to flow between attacks. Your handstand base gives you a big head start here."}, {"id": "flip", "name": "Flips", "en": "Acrobacias", "color": "#3fd18b", "intro": "Airborne and walkover movements. Train them on grass or a thick mat, never tired, and with a spotter for the first full attempts. Each one lists the move you should own first."}], "levels": {"1": "Beginner", "2": "Intermediate", "3": "Advanced"}, "moves": [{"id": "ginga", "name": "Ginga", "cat": "fund", "lvl": 1, "en": "The swing", "what": "The constant rocking step of capoeira: a triangle step from side to side with one leg back at a time, the opposite arm guarding the face. It keeps you moving, hides your next move and loads every kick and escape.", "cues": ["Feet stay shoulder-width; the back foot steps diagonally behind, never straight back.", "Knees bent the whole time - your head should not bob up and down.", "The arm on the side of the forward leg crosses in front of the face.", "Chest slightly forward over the front knee; weight on the balls of the feet."], "mistakes": ["Standing tall and stiff-legged.", "Stepping straight back so the stance becomes narrow.", "Dropping the guard arm.", "Looking at the floor."], "drills": ["Static triangle: step into each corner and hold 3 s.", "Slow ginga to a 4-count, 2 minutes.", "Ginga with a wider, lower stance (thighs near parallel).", "Ginga in a circle and changing rhythm (slow, fast, broken)."], "alt": "Shorter step and a higher stance until your legs adapt."}, {"id": "cocorinha", "name": "Cocorinha", "cat": "fund", "lvl": 1, "en": "Little squat", "what": "A full deep squat with heels down, one arm guarding the head. The first defense against high kicks and the bottom position for many transitions.", "cues": ["Heels flat, knees out over toes.", "Guard arm bent above the head, other hand can touch the floor.", "Eyes on the opponent - head up."], "mistakes": ["Heels lifting.", "Dropping the head between the knees.", "Collapsing forward onto the hands."], "drills": ["Deep squat holds, 3 x 30 s.", "Ginga to cocorinha and back, 10 each side.", "Cocorinha shuffle - move sideways staying low."], "alt": "Heels on a small wedge or plate until ankle mobility improves."}, {"id": "negativa", "name": "Negativa", "cat": "fund", "lvl": 1, "en": "The negative", "what": "A low position on one bent leg with the other leg stretched along the floor, one hand on the floor and the other guarding the face. A defense, a ground base and the start of rolê and rasteira.", "cues": ["Support leg fully bent, foot flat.", "Extended leg straight, foot flexed, resting on the heel or side of the foot.", "Supporting hand placed beside the hip, not behind you.", "Chest turned toward the extended leg, guard arm up."], "mistakes": ["Sitting on the floor.", "Hand too far behind so the chest opens to the sky.", "Extended leg bent."], "drills": ["Ginga to negativa, 8 per side slowly.", "Negativa switches: pass from one side to the other staying low.", "Negativa to rolê to ginga flow."], "alt": "Place the hand on a yoga block to raise the floor."}, {"id": "role", "name": "Rolê", "cat": "fund", "lvl": 1, "en": "The roll-away", "what": "A low turning displacement on the hands and feet, used to escape and change sides. From negativa you rotate over both hands and come back facing the opponent.", "cues": ["Both hands planted, hips stay low.", "Turn the head first, the hips follow.", "Finish in negativa or ginga facing forward."], "mistakes": ["Hips too high (becomes a bear crawl).", "Losing sight of the opponent for too long."], "drills": ["Rolê from negativa, 6 each way.", "Rolê chain across the room and back.", "Rolê into aú."], "alt": "Do the turn in two steps: hands first, then feet."}, {"id": "au", "name": "Aú", "cat": "fund", "lvl": 1, "en": "Capoeira cartwheel", "what": "A cartwheel with the eyes on the opponent, legs passing slightly bent or open, often slower and more controlled than a gym cartwheel. Used to move in and out of the game.", "cues": ["Look between your hands toward where the opponent would be, not at the floor.", "Hands land one after the other in a line.", "Legs open wide over the top, active toes.", "Land in ginga or negativa, ready."], "mistakes": ["Looking at the floor.", "Piking at the hips so the aú becomes a hop.", "Landing upright and flat-footed."], "drills": ["Low aú with bent legs over a line.", "Aú to the left and right, 6 each.", "Slow aú with a 1 s pause on the hands.", "Aú into negativa."], "alt": "Bent-leg low aú or a kick-over to the side."}, {"id": "queda4", "name": "Queda de quatro", "cat": "fund", "lvl": 1, "en": "Fall onto four", "what": "Dropping back to sit with hands behind you and feet in front - an emergency escape and a base for the macaco.", "cues": ["Hands land behind the hips, fingers turned outward or back.", "Hips stay off the floor.", "Come back up through cocorinha or a rolê."], "mistakes": ["Locked elbows on the landing.", "Sitting down fully."], "drills": ["Squat to queda de quatro, 10 reps.", "Queda de quatro walking forward and back.", "Queda de quatro to bridge push (macaco prep)."], "alt": "Lower slowly from a squat instead of dropping."}, {"id": "ponte", "name": "Ponte", "cat": "fund", "lvl": 2, "en": "Bridge", "what": "The back bend that opens the shoulders and spine for macaco, aú de cabeça and walkovers. Treated here as a daily mobility skill.", "cues": ["Push the floor away until the arms are straight.", "Shoulders over the wrists, not behind them.", "Squeeze glutes lightly, knees track over toes."], "mistakes": ["Bending only at the lower back.", "Feet turned out wide."], "drills": ["Wall slides with arms overhead, 2 x 10.", "Bridge holds 3 x 20 s, feet raised on a step if needed.", "Bridge rocks (shoulders over hands).", "Bridge walk-downs on a wall."], "alt": "Feet elevated bridge or a table-top hold."}, {"id": "meialua_frente", "name": "Meia-lua de frente", "cat": "atk", "lvl": 1, "en": "Front half-moon", "what": "An outside-to-inside circular kick with a straight leg, in front of the body. Usually the first kick taught.", "cues": ["The kick leaves from the back leg of the ginga.", "Leg straight, circle from outside to inside at head height.", "Supporting heel turns slightly; guard stays up.", "Return to ginga - don't let the leg drop and stay."], "mistakes": ["Bending the knee.", "Leaning far back.", "Kicking without coming back to the ginga."], "drills": ["Slow motion kicks touching a hand held at shoulder height.", "10 per side from ginga.", "Double meia-lua (one each leg) in rhythm."], "alt": "Lower height (waist) until hip mobility allows more."}, {"id": "queixada", "name": "Queixada", "cat": "atk", "lvl": 1, "en": "Jaw kick", "what": "An inside-to-outside circular kick: you step across with the front foot, turn the hips, and the back leg circles outward.", "cues": ["Step diagonally to close the hips first.", "The kicking leg rises across the body and opens outward.", "Upper body leans away slightly as a counter-balance."], "mistakes": ["No step - kicking from a square stance.", "Swinging the arms wildly."], "drills": ["Step + hold position, then kick slowly.", "8 per side from ginga.", "Queixada into esquiva lateral."], "alt": "Bent-knee version at waist height."}, {"id": "armada", "name": "Armada", "cat": "atk", "lvl": 1, "en": "Spinning kick", "what": "A spinning outside kick: step across, turn your back briefly, look over the shoulder and sweep the straight leg around.", "cues": ["Step the front foot across, turn on the balls of the feet.", "Head and eyes turn first - spot the target over your shoulder.", "Kicking leg straight, hips stay upright.", "Finish facing forward in ginga."], "mistakes": ["Turning blind (leg before eyes).", "Falling out of the spin.", "Kick too low and bent."], "drills": ["Spin walk-through without kicking, 10 each side.", "Armada touching a target (hand/bag).", "Armada into negativa."], "alt": "Half-turn without the full leg extension."}, {"id": "bencao", "name": "Bênção", "cat": "atk", "lvl": 1, "en": "Blessing / front push kick", "what": "A straight push kick with the sole of the foot to the chest or belly, pushing the opponent away.", "cues": ["Lift the knee first, then push the heel through.", "Hips push forward at the end.", "Retract the leg back to ginga."], "mistakes": ["Snapping the leg (it's a push, not a snap).", "Leaning back too much."], "drills": ["Knee lift + extend slowly, 8 per side.", "Bênção against a wall or bag.", "Bênção to step forward and ginga."], "alt": "Lower target height."}, {"id": "martelo", "name": "Martelo", "cat": "atk", "lvl": 2, "en": "Hammer kick", "what": "A roundhouse kick hitting with the instep - fast and direct, more like a martial arts kick than the circular capoeira kicks.", "cues": ["Pivot the supporting foot.", "Knee comes up and across, then the shin snaps.", "Guard up, eyes on target."], "mistakes": ["No pivot on the standing foot (knee strain).", "Dropping the guard."], "drills": ["Chamber + extend slowly, 6 per side.", "Martelo on a bag or held target.", "Low-mid-high martelo ladder."], "alt": "Knee-height martelo."}, {"id": "chapa", "name": "Chapa", "cat": "atk", "lvl": 1, "en": "Side push kick", "what": "A side or back push kick with the sole of the foot, often thrown from a low or turned position.", "cues": ["Chamber the knee toward the chest.", "Push the heel out sideways, toes slightly down.", "Look past your shoulder at the target."], "mistakes": ["Leaning so far that you lose the guard.", "Kicking with the toes."], "drills": ["Chamber + push, 8 per side.", "Chapa de costas (back kick) from ginga.", "Chapa baixa from the floor (hands down)."], "alt": "Hand on a wall for balance."}, {"id": "compasso", "name": "Meia-lua de compasso", "cat": "atk", "lvl": 2, "en": "Compass half-moon", "what": "The signature capoeira kick: hands go to the floor and you spin, sweeping the heel around in a big arc. Also called rabo de arraia.", "cues": ["Step across, both hands to the floor beside the front foot.", "Look under your arm at the target all through the spin.", "Heel leads, leg straight, hips rotate fully.", "Finish in ginga, guard up."], "mistakes": ["Losing sight of the target.", "Hands too far from the foot.", "Bending the kicking leg."], "drills": ["Hands-down position + slow walk-through.", "Compasso to a target at waist height.", "Full speed compasso 6 per side.", "Compasso into rolê."], "alt": "Lower kick height and slower turn."}, {"id": "rasteira", "name": "Rasteira", "cat": "atk", "lvl": 2, "en": "Sweep", "what": "A low sweep from negativa: the extended leg hooks behind the opponent's support foot and pulls it away. Train it on a partner's ankle or a cone.", "cues": ["Enter low in negativa beside the opponent's foot.", "Hook with the foot or ankle, pull toward you.", "Keep your hand on the floor and the guard up."], "mistakes": ["Kicking the ankle instead of hooking.", "Coming in standing up."], "drills": ["Negativa slides to a cone, 8 per side.", "Rasteira on a cone or water bottle.", "Ginga - esquiva - rasteira counter combo."], "alt": "Practise only the entry into negativa."}, {"id": "tesoura", "name": "Tesoura", "cat": "atk", "lvl": 2, "en": "Scissors", "what": "A takedown where you trap the opponent's legs between yours from a low position. Train the entry solo and the finish only with a willing partner on a mat.", "cues": ["Enter low from negativa or an aú.", "Legs close like scissors at knee height.", "Turn the hips to finish."], "mistakes": ["Diving in head first.", "Twisting a partner's knee - always go slowly."], "drills": ["Tesoura entry shapes in the air, 6 per side.", "Tesoura on a rolled mat.", "Tesoura from aú (advanced)."], "alt": "Solo shapes only."}, {"id": "vingativa", "name": "Vingativa", "cat": "atk", "lvl": 2, "en": "The revenge", "what": "A hip throw from a low position: you step behind the opponent's leg and push them back over it with your body.", "cues": ["Step deep beside and behind their leg.", "Shoulder and hip drive back and across."], "mistakes": ["Standing too far away.", "Pushing with the arms only."], "drills": ["Shadow vingativa entry, 8 per side.", "Vingativa on a heavy bag or partner, slowly."], "alt": "Solo entry only."}, {"id": "pulada", "name": "Armada pulada", "cat": "atk", "lvl": 3, "en": "Jumping armada", "what": "A jumping version of the armada: take off during the spin and kick in the air, landing on the kicking leg or both feet.", "cues": ["Fast, clean armada first.", "Drive the knee of the free leg up to lift.", "Spot the landing, land soft in ginga."], "mistakes": ["Jumping without enough rotation.", "Landing with straight knees."], "drills": ["Armada with a small hop.", "Spin jumps (360) landing balanced.", "Full armada pulada on grass."], "alt": "Fast standing armada.", "pre": "armada"}, {"id": "martelo_rodado", "name": "Martelo rodado", "cat": "atk", "lvl": 3, "en": "Spinning hammer", "what": "A jumping spinning martelo: spin like an armada, then whip the other leg round like a martelo in the air.", "cues": ["Strong armada-style spin.", "Switch legs in the air - the second leg kicks.", "Land on the kicking leg first."], "mistakes": ["Not enough height.", "Kicking with the wrong leg."], "drills": ["360 jumps with knee lift.", "Armada + martelo combo without the jump.", "Martelo rodado on grass."], "alt": "Armada + martelo on the ground.", "pre": "armada"}, {"id": "parafuso", "name": "Parafuso", "cat": "atk", "lvl": 3, "en": "The screw", "what": "A jumping spinning kick on a vertical axis: you take off out of a turn, spin in the air and whip the leg round at the top - the big brother of the martelo rodado. (The horizontal, B-twist-like aerial is the S-dobrado, in Acrobacias.)", "cues": ["Wind up with a step across and a strong arm swing in the direction of the spin.", "Jump straight up - the body stays vertical.", "Spot the target over the shoulder, then whip the kicking leg through.", "Land on the kicking leg, soft knee."], "mistakes": ["Leaning or traveling sideways in the air.", "Weak arm swing, so not enough rotation."], "drills": ["360 spin jumps landing balanced.", "Martelo rodado clean on both sides.", "Parafuso on grass, low then full height."], "alt": "Martelo rodado.", "pre": "martelo_rodado"}, {"id": "cabecada", "name": "Cabeçada", "cat": "atk", "lvl": 1, "en": "Headbutt", "what": "A head strike to the chest from a low entry. Practised solo or on a bag to learn the entry - never with full contact on a partner.", "cues": ["Lower the body and step in.", "Neck locked, strike with the top of the forehead.", "Arms guard the face."], "mistakes": ["Leading with the face.", "Loose neck."], "drills": ["Entry drill from ginga, 8 reps.", "Cabeçada on a pad or bag, light."], "alt": "Entry footwork only."}, {"id": "esq_lateral", "name": "Esquiva lateral", "cat": "def", "lvl": 1, "en": "Side dodge", "what": "Drop sideways and low, with one hand on the floor and the guard arm up, letting a circular kick pass over.", "cues": ["Step to the side and bend the knee on that side.", "Hand on the floor beside the foot, other arm guarding.", "Eyes on the kick."], "mistakes": ["Staying too high.", "Turning the back."], "drills": ["Ginga to esquiva lateral 10 per side.", "Esquiva + return to ginga in rhythm.", "Esquiva lateral against a partner's slow meia-lua."], "alt": "Smaller dodge with hands on knees.", "defends": ["meialua_frente", "armada", "queixada", "compasso"]}, {"id": "esq_baixa", "name": "Esquiva baixa", "cat": "def", "lvl": 1, "en": "Low dodge", "what": "From the ginga, drop low with the chest forward over the front leg and the arm protecting the head.", "cues": ["Lower over the front leg, chest low.", "Back leg extended behind.", "Hand guards the head."], "mistakes": ["Bending the back without bending the legs."], "drills": ["Ginga to esquiva baixa, 10 per side.", "Esquiva baixa + armada counter."], "alt": "Higher dodge.", "defends": ["armada", "compasso", "martelo"]}, {"id": "esq_frente", "name": "Esquiva de frente", "cat": "def", "lvl": 1, "en": "Front dodge", "what": "Duck forward and down, under a kick coming straight or high, ready to counter.", "cues": ["Bend forward from the hips with bent knees.", "Both arms guarding.", "Come out ready to strike or roll."], "mistakes": ["Looking at the floor.", "Locked knees."], "drills": ["Ginga + duck 10 reps.", "Duck + cabeçada entry."], "alt": "Smaller duck.", "defends": ["bencao", "martelo", "queixada"]}, {"id": "cocorinha_def", "name": "Cocorinha (defesa)", "cat": "def", "lvl": 1, "en": "Squat dodge", "what": "Using the cocorinha as a defense: drop straight down under a high kick with the arm guarding the head.", "cues": ["Drop fast, heels down.", "Guard arm high.", "Spring back to ginga."], "mistakes": ["Late drop.", "Leaning back."], "drills": ["Partner or shadow: kick passes, you drop, 10 reps.", "Cocorinha + rasteira counter."], "alt": "Half squat.", "defends": ["armada", "meialua_frente"]}, {"id": "negativa_def", "name": "Negativa (defesa)", "cat": "def", "lvl": 1, "en": "Negative as defense", "what": "Going to negativa to escape a kick, leaving you low and ready to rasteira or rolê.", "cues": ["Drop and extend the leg toward the attacker.", "Hand on the floor, guard up.", "Turn the chest toward the attacker."], "mistakes": ["Ending with your back to the attacker."], "drills": ["Ginga to negativa on a call, 10 reps.", "Negativa + rasteira counter."], "alt": "Higher negativa with a block under the hand.", "defends": ["compasso", "armada", "martelo"]}, {"id": "role_def", "name": "Rolê (fuga)", "cat": "def", "lvl": 1, "en": "Roll escape", "what": "Rolling away from pressure along the floor to come back facing the opponent at a safe distance.", "cues": ["Low and fast.", "Look back quickly."], "mistakes": ["Rolling toward the attacker."], "drills": ["Negativa - rolê - ginga flow 6 times.", "Rolê away from a pushing partner."], "alt": "Slow rolê.", "defends": ["bencao", "chapa"]}, {"id": "resistencia", "name": "Resistência", "cat": "def", "lvl": 2, "en": "Resistance", "what": "A low defense with the body leaning back and supported on one hand, close to the opponent, letting a kick pass just above. Leads directly into rasteira and vingativa.", "cues": ["Hips close to the floor, support hand behind.", "Body very close to the attacker.", "Guard arm up."], "mistakes": ["Sitting down.", "Leaning away so far you can't come back."], "drills": ["Resistência holds 5 x 10 s per side.", "Resistência to rasteira counter.", "Resistência to vingativa entry."], "alt": "Esquiva lateral.", "defends": ["queixada", "armada", "martelo"]}, {"id": "cruz", "name": "Cruz / bloqueio", "cat": "def", "lvl": 2, "en": "Block", "what": "A blocking defense with the forearms crossed or with one forearm, used only when you can't escape a fast straight kick.", "cues": ["Forearms tense, elbows bent.", "Block and turn the body to deflect, not to absorb."], "mistakes": ["Blocking with open hands.", "Standing still after the block."], "drills": ["Shadow blocks 10 reps.", "Light blocks against a partner's slow bênção."], "alt": "Esquiva instead.", "defends": ["bencao", "martelo", "chapa"]}, {"id": "contra", "name": "Esquiva + contra-ataque", "cat": "def", "lvl": 2, "en": "Dodge and counter", "what": "The real goal of defense: every esquiva flows into an attack. Classic pairs: esquiva lateral - meia-lua de compasso; cocorinha - rasteira; negativa - rolê - armada.", "cues": ["Never freeze in the defense.", "Counter with the leg that is already loaded.", "Stay low until the attacker's leg passes."], "mistakes": ["Coming up too early.", "Counter-attacking from a position with no balance."], "drills": ["Pairs drill: 5 reps of each defense-counter pair.", "Shadow game 2 x 2 min.", "Partner game at slow speed."], "alt": "Do the pairs separately at slow speed.", "defends": ["meialua_frente", "armada", "queixada", "compasso", "martelo"]}, {"id": "queda_rins", "name": "Queda de rins", "cat": "flo", "lvl": 1, "en": "Kidney drop", "what": "A low balance on one or both hands with the elbow tucked into the side of the waist and the legs off the floor, head close to the ground. A pause between movements and a base for many floreios.", "cues": ["Elbow into the hip bone, just below the ribs.", "Head on or near the floor as a third point at first.", "Legs tucked, then extended."], "mistakes": ["Elbow sliding onto the stomach.", "All weight on the head."], "drills": ["Tripod with head down, 3 x 15 s.", "Queda de rins legs tucked, 3 x 10 s per side.", "Queda de rins legs extended.", "Queda de rins from ginga and back."], "alt": "Keep the head on the floor and toes on the floor."}, {"id": "bananeira", "name": "Bananeira", "cat": "flo", "lvl": 1, "en": "Handstand", "what": "The capoeira handstand - more alive than the gym version, with bent legs, walking and looking forward. Your strong handstand makes this an early win.", "cues": ["Look forward at the opponent, not at the floor.", "Legs can be bent or open - stay balanced.", "Walk in all directions."], "mistakes": ["Gym-perfect line but no awareness of the opponent."], "drills": ["Bananeira walk 3 x 5 m.", "Bananeira with leg shapes (open, stag, bent).", "Bananeira to queda de rins."], "alt": "Wall walk or crow."}, {"id": "au_fechado", "name": "Aú fechado", "cat": "flo", "lvl": 1, "en": "Closed cartwheel", "what": "A slow aú with legs bent and tucked, staying protected; often paused in the middle like a handstand.", "cues": ["Knees bent and close together.", "Pause over the hands.", "Eyes forward."], "mistakes": ["Rushing.", "Legs opening wide."], "drills": ["Slow aú fechado with 2 s pause, 6 per side.", "Aú fechado to queda de rins."], "alt": "Low aú."}, {"id": "au_cabeca", "name": "Aú de cabeça", "cat": "flo", "lvl": 2, "en": "Head cartwheel", "what": "A cartwheel that goes through a headstand - the head stays on the floor as the legs pass over.", "cues": ["Triangle base: head and both hands.", "Legs pass slowly over the top.", "Strong neck, most weight on the hands."], "mistakes": ["All weight on the head.", "Rolling over the neck."], "drills": ["Tripod headstand holds 3 x 20 s.", "Tripod leg passes, half way, 6 per side.", "Full aú de cabeça."], "alt": "Tripod headstand only."}, {"id": "piao_cabeca", "name": "Pião de cabeça", "cat": "flo", "lvl": 2, "en": "Head spin", "what": "A spin on the head from a tripod position, legs open. Use a cap or beanie and a smooth floor.", "cues": ["Tripod base, push with hands to spin.", "Legs open wide to keep balance.", "Short spins at first."], "mistakes": ["Spinning on the neck.", "Hard floor and no head protection."], "drills": ["Tripod holds with legs open.", "Quarter turns pushing with the hands.", "2-3 spins."], "alt": "Tripod with leg shapes."}, {"id": "au_batido", "name": "Aú batido", "cat": "flo", "lvl": 2, "en": "Kicking cartwheel", "what": "A one-handed aú paused in the middle with a kick from the top leg (like a chapa or a hammer). Builds the one-arm support used for advanced floreios.", "cues": ["One-arm support, shoulder over the hand.", "Top leg kicks while the bottom leg balances.", "Return to the floor softly."], "mistakes": ["Collapsed shoulder.", "Kicking too early."], "drills": ["One-handed aú, 6 per side.", "Aú paused on one hand, 3 x 5 s per side.", "Full aú batido."], "alt": "One-handed aú without the kick."}, {"id": "macaco", "name": "Macaco", "cat": "flip", "lvl": 2, "en": "Monkey flip", "what": "A back walkover from a low squat over one hand: sit back, reach one arm behind, push from the legs and bring the hips over. You listed this as hard - it's built step by step over the program.", "cues": ["Start low on one hand behind you, opposite arm over the head.", "Push the hips up hard from the legs.", "Head looks back toward the hand.", "Second hand and feet land in a squat."], "mistakes": ["Not enough hip drive.", "Throwing the head before the hips.", "Hand placed too far behind."], "drills": ["Queda de quatro to bridge push, 3 x 8.", "Macaco over a rolled mat or a sofa back.", "Spotted macaco on grass.", "Macaco from cocorinha."], "alt": "Hips-up bridge push from queda de quatro."}, {"id": "au_quebrado", "name": "Aú quebrado", "cat": "flo", "lvl": 3, "en": "Broken cartwheel", "what": "A one-arm hand-balance where the body bends (arches) and the legs drop behind the head, held on the elbow in the side like a queda de rins in the air. Advanced and very shoulder-dependent.", "cues": ["Elbow into the side like queda de rins.", "Arch the back and drop the legs over.", "Eyes on the floor ahead."], "mistakes": ["Forcing the back without shoulder opening."], "drills": ["Queda de rins legs extended long holds.", "Queda de rins to arch shape.", "Aú quebrado held 3 s."], "alt": "Queda de rins with leg shapes.", "pre": "queda_rins"}, {"id": "piao_mao", "name": "Pião de mão", "cat": "flo", "lvl": 3, "en": "Hand spin", "what": "Spinning on one hand in a bent-arm or straight-arm one-hand balance - your one-arm handstand work feeds this directly.", "cues": ["Hand turned out, fingers spread.", "Legs open for balance and rotation.", "Spin with the hips, not the arm."], "mistakes": ["Spinning from the shoulder."], "drills": ["One-hand queda de rins, 3 x 5 s.", "Quarter turns on one hand.", "Full turn."], "alt": "Two-hand pião (shuffle hands).", "pre": "au_batido"}, {"id": "relogio", "name": "Relógio", "cat": "flo", "lvl": 3, "en": "The clock", "what": "A spin on one hand in queda de rins position, body horizontal, rotating like a clock hand.", "cues": ["Strong queda de rins with legs extended.", "Push the floor with the free hand to start.", "Head off the floor."], "mistakes": ["Dropping the hips."], "drills": ["Queda de rins head off the floor.", "Queda de rins quarter turns.", "Full relógio."], "alt": "Queda de rins hold.", "pre": "queda_rins"}, {"id": "jump_tuck", "name": "Salto grupado", "cat": "flip", "lvl": 1, "en": "Tuck jump base", "what": "The jumping base for all flips: maximal vertical jump with a fast knee tuck, landing soft.", "cues": ["Arms swing up hard.", "Knees to chest at the top.", "Land with bent knees and quiet feet."], "mistakes": ["Jumping forward instead of up.", "Hard landings."], "drills": ["Tuck jumps 3 x 6.", "Tuck jumps from a deep squat.", "Tuck jump with half turn."], "alt": "Squat jumps."}, {"id": "au_uma_mao", "name": "Aú de uma mão", "cat": "flip", "lvl": 1, "en": "One-handed cartwheel", "what": "An aú placing only the far hand - the step toward the aú sem mão.", "cues": ["Strong kick of the back leg.", "Far hand only, close to the front foot.", "Chest stays up."], "mistakes": ["Hand too far away."], "drills": ["Low one-hand aú 6 per side.", "Fast one-hand aú.", "One-hand aú with fingertips only."], "alt": "Normal aú."}, {"id": "macaco_pe", "name": "Macaco em pé", "cat": "flip", "lvl": 2, "en": "Standing macaco", "what": "The macaco starting from standing: you sit back into a low squat with the hand already reaching and flow straight into the walkover.", "cues": ["Clean macaco first.", "Sit back fast and keep looking at the hand.", "Strong hip drive."], "mistakes": ["Stopping at the bottom."], "drills": ["Macaco from cocorinha 5 per side.", "Macaco em pé on grass, spotted."], "alt": "Macaco from the floor.", "pre": "macaco"}, {"id": "au_sem_mao", "name": "Aú sem mão", "cat": "flip", "lvl": 3, "en": "Aerial", "what": "A no-hands cartwheel. Built from the one-handed aú with fast leg drive, chest staying up.", "cues": ["Long step, hard kick of the back leg.", "Chest stays up, head neutral.", "Arms swing and stay out of the way.", "Land one foot after the other."], "mistakes": ["Throwing the head down.", "Short step and no leg drive."], "drills": ["Fast one-hand aú with fingertips.", "Aú sem mão downhill on grass.", "Aú sem mão on grass with a spotter at the hips."], "alt": "Fingertip aú.", "pre": "au_uma_mao"}, {"id": "mortal", "name": "Mortal de costas", "cat": "flip", "lvl": 3, "en": "Back tuck", "what": "A standing back flip. Only after strong tuck jumps and spotted attempts on soft ground. No trampoline needed, but a spotter is.", "cues": ["Jump UP, not back.", "Arms reach up, knees pull to the chest.", "Spot the floor and land with bent knees."], "mistakes": ["Throwing the head back early.", "Jumping backward and low."], "drills": ["Tuck jumps with a high reach.", "Back roll and back roll to push-up.", "Back tuck off a small raised surface onto a thick mat, spotted.", "Back tuck on grass, spotted."], "alt": "Back roll + tuck jumps.", "pre": "jump_tuck"}, {"id": "folha_seca", "name": "Folha seca", "cat": "flip", "lvl": 3, "en": "Dry leaf", "what": "A back flip that comes out of a kick: the kicking leg swings up and pulls the body over backward, landing on the kicking leg.", "cues": ["Mortal must be solid first.", "Kick high with a straight leg.", "Land on the kicking leg."], "mistakes": ["Low kick, no rotation."], "drills": ["High front kicks with a hop.", "Mortal on grass.", "Folha seca spotted on grass."], "alt": "Mortal de costas.", "pre": "mortal"}, {"id": "s_dobrado", "name": "S-dobrado", "cat": "flip", "lvl": 3, "en": "Butterfly-twist family", "what": "A twisting function nav(){$("#nav").innerHTML=TABS.map(([id,l,i])=>`<button class="${S.tab===id?"on":""}" data-tab="${id}"><span class="i">${i}</span>${l}</button>`).join("")}

const NOSIDE=new Set(["jump_tuck","cocorinha_def","queda4","ponte","bananeira","ginga","esq_frente","cruz","contra","cabecada"]);
function doseFor(m){
  const side=NOSIDE.has(m.id)?"":" per side";
  const kindHold=["queda_rins","ponte","resistencia","au_quebrado"];
  const kindAtt=["piao_cabeca","pulada","martelo_rodado","parafuso","piao_mao","relogio","au_sem_mao","mortal","folha_seca","s_dobrado","macaco","macaco_pe"];
  if(m.pre&&!S.mastered[m.pre])return `Drills 1-2 only - own ${MOVES[m.pre].name} first`;
  if(m.id==="ginga")return "4 min flow";
  if(m.id==="bananeira")return "3 x 40 s alive";
  if(kindHold.includes(m.id))return ({1:"3 x 20 s",2:"3 x 12 s",3:"4 x 5 s"})[m.lvl]+side;
  if(kindAtt.includes(m.id))return m.cat==="flip"?"4 attempts, spotted, on grass":"5 quality attempts";
  return ({1:"3 x 6",2:"3 x 5",3:"3 x 3"})[m.lvl]+side;
}
function buildSession(){
  if(!S.pick.length)return;
  const budget=({30:4,45:6,60:8,75:10})[S.mins]||8;
  const picks=S.pick.slice(0,budget);
  const base=Math.floor(budget/picks.length),extra=budget%picks.length;
  const out=[];
  const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
  picks.forEach((cid,ci)=>{
    const perCat=base+(ci<extra?1:0);
    const L=S.levels[cid];
    const pool=D.moves.filter(m=>m.cat===cid&&m.lvl<=L);
    const cur=pool.filter(m=>m.lvl===L&&!S.mastered[m.id]);
    const rest=pool.filter(m=>!cur.includes(m));
    [...sh(cur),...sh(rest)].slice(0,perCat).forEach(m=>out.push({move:m.id,dose:doseFor(m)}));
  });
  const minL=Math.min(...S.pick.map(c=>S.levels[c]));
  const cs=D.combos.filter(c=>c.lvl===minL);
  const combo=cs[Math.floor(Math.random()*cs.length)]||D.combos[0];
  S.built={blocks:out,combo:combo.id,mins:S.mins};save();
}
function today(){
  let h=`<h2>Build today's session</h2><div class="card"><div class="small mut" style="margin-bottom:8px">Tick what you want to train today. Moves are picked from your level in each area (set it in Progress).</div>
  <div class="chips">${D.cats.map(c=>`<button class="chip ${S.pick.includes(c.id)?"on":""}" data-pick="${c.id}">${c.name} · L${S.levels[c.id]}</button>`).join("")}</div>
  <div class="small mut" style="margin-bottom:6px">Session length</div>
  <div class="seg" style="margin-bottom:12px">${[30,45,60,75].map(n=>`<button class="${S.mins===n?"on":""}" data-mins="${n}">${n} min</button>`).join("")}</div>
  <button class="btn" id="build" ${S.pick.length?"":"disabled"}>Build my session</button></div>`;
  if(S.built&&S.built.blocks.length){
    const b=S.built;
    h+=`<div class="card"><h3 style="margin-top:0">Warm-up · 10 min</h3><ul class="small">${D.warmup.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <div class="card"><h3 style="margin-top:0">Skill blocks</h3>${b.blocks.map(x=>{const m=MOVES[x.move];return `<div class="blk"><div><span class="dot" style="background:${CATS[m.cat].color}"></span>${mvLink(m.id)}<div class="small mut">${esc(m.en)}</div></div><div class="d">${esc(x.dose)}</div></div>`}).join("")}
    <div class="small mut" style="margin-top:8px">Tap a move for cues, drills and an easier option.</div></div>
    <div class="card"><h3 style="margin-top:0">Combo · 10 min</h3>${comboHTML(COMBOS[b.combo])}<div class="small mut" style="margin-top:6px">4 rounds per side, slow first round, then flow.</div></div>
    <div class="card"><h3 style="margin-top:0">Cool-down · 5 min</h3><ul class="small">${D.cooldown.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <button class="btn ghost" id="build2" ${S.pick.length?"":"disabled"}>↻ Shuffle moves</button>`;
  }
  return h;
}
function comboHTML(c){return `<b>${esc(c.name)}</b> ${lvTag(c.lvl)}<div class="seq">${c.moves.map((n,i)=>(i?'<span class="arrow">→</span>':'')+`<span ${BYNAME[n]?`class="link" data-mv="${BYNAME[n].id}"`:""}>${esc(n)}</span>`).join("")}</div>`}

/* ---------- PROGRAM ---------- */
function program(){
  const total=D.program.length*3,dn=Object.keys(S.done).filter(k=>S.done[k]).length;
  const w=D.program[S.week-1],ph=D.phases[w.phase-1];
  let h=`<h2>12-week program</h2><div class="card"><div class="row"><div class="small mut">${dn} / ${total} sessions done</div><div style="text-align:right" class="small done">${Math.round(dn/total*100)}%</div></div><div class="bar" style="margin-top:6px"><div style="width:${dn/total*100}%"></div></div><div class="small mut" style="margin-top:10px">${esc(D.schedule)}</div></div>
  <div class="weeks">${D.program.map(x=>{const full=["A","B","C"].every(k=>S.done[x.week+k]);return `<button class="${x.week===S.week?"on":""} ${full?"full":""}" data-week="${x.week}">W${x.week}</button>`}).join("")}</div>
  <div class="card"><b>${esc(ph.name)}</b> · Week ${w.week}${w.deload?'<span class="tag">'+(w.week===12?"TEST":"DELOAD")+'</span>':""}<div class="small mut" style="margin-top:4px">${esc(ph.goal)}</div>${w.note?`<div class="small" style="margin-top:8px">${esc(w.note)}</div>`:""}</div>`;
  w.sessions.forEach(s=>{
    const k=w.week+s.key;
    h+=`<div class="card"><div class="row"><h3 style="margin:0">Session ${s.key} · ${esc(s.title)}</h3></div>
    <div class="small mut" style="margin:6px 0 4px">Warm-up 10 min (see Today tab list)</div>
    ${s.blocks.map(b=>{const m=MOVES[b.move];return `<div class="blk"><div><span class="dot" style="background:${CATS[m.cat].color}"></span>${mvLink(m.id)} ${S.mastered[m.id]?'<span class="done">✓</span>':""}</div><div class="d">${esc(b.dose)}</div></div>`}).join("")}
    <h3>Combos · ${esc(s.comboDose)}</h3>${s.combos.map(c=>`<div style="margin-bottom:8px">${comboHTML(COMBOS[c])}</div>`).join("")}
    <h3>Conditioning</h3><ul class="small">${s.conditioning.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <label class="chk"><input type="checkbox" data-done="${k}" ${S.done[k]?"checked":""}> Session done</label></div>`;
  });
  return h;
}

/* ---------- LIBRARY ---------- */
function library(){
  const c=CATS[S.libCat];
  const ms=D.moves.filter(m=>m.cat===c.id).sort((a,b)=>a.lvl-b.lvl);
  let h=`<h2>Library</h2><div class="chips">${D.cats.map(x=>`<button class="chip ${S.libCat===x.id?"on":""}" data-lib="${x.id}">${x.name}</button>`).join("")}</div>
  <div class="card"><b><span class="dot" style="background:${c.color}"></span>${c.name}</b> <span class="mut">· ${c.en}</span><div class="small mut" style="margin-top:6px">${esc(c.intro)}</div></div><div class="card">`;
  ms.forEach(m=>{h+=`<div class="move" data-mv="${m.id}"><div><b>${esc(m.name)}</b> ${S.mastered[m.id]?'<span class="done">✓</span>':""}<div class="en">${esc(m.en)}</div></div>${lvTag(m.lvl)}</div>`});
  h+=`</div><h3>Combos</h3>${D.combos.map(cb=>`<div class="card">${comboHTML(cb)}</div>`).join("")}`;
  return h;
}
function openMove(id){
  const m=MOVES[id],c=CATS[m.cat];
  let h=`<button class="x" id="closeM">✕</button><div class="small" style="color:${c.color}">${c.name} · ${D.levels[m.lvl]}</div><h2 style="margin:4px 0 2px">${esc(m.name)}</h2><div class="mut">${esc(m.en)}</div>
  <p>${esc(m.what)}</p><h3>Key cues</h3><ul>${m.cues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3>Common mistakes</h3><ul>${m.mistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3>Progression</h3><ol style="padding-left:20px">${m.drills.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  <h3>Easier option</h3><p class="small">${esc(m.alt)}</p>`;
  if(m.pre)h+=`<h3>Own this first</h3><div class="seq"><span class="link" data-mv="${m.pre}">${esc(MOVES[m.pre].name)}</span></div>`;
  if(m.defends)h+=`<h3>Works against</h3><div class="seq">${m.defends.map(d=>`<span class="link" data-mv="${d}">${esc(MOVES[d].name)}</span>`).join("")}</div>`;
  const counters=D.moves.filter(x=>x.defends&&x.defends.includes(m.id));
  if(counters.length)h+=`<h3>Defend it with</h3><div class="seq">${counters.map(d=>`<span class="link" data-mv="${d.id}">${esc(d.name)}</span>`).join("")}</div>`;
  h+=`<label class="chk" style="margin-top:12px"><input type="checkbox" data-mast="${m.id}" ${S.mastered[m.id]?"checked":""}> I own this move</label>`;
  $("#sheet").innerHTML=h;$("#modal").classList.add("open");$("#sheet").scrollTop=0;
}

/* ---------- PROGRESS ---------- */
function progress(){
  let h=`<h2>Progress</h2><div class="card small mut">Set your level per area. The Today builder uses it to pick moves. Move up when you own most moves of your current level.</div>`;
  D.cats.forEach(c=>{
    const all=D.moves.filter(m=>m.cat===c.id),own=all.filter(m=>S.mastered[m.id]).length;
    h+=`<div class="card"><div class="row"><b><span class="dot" style="background:${c.color}"></span>${c.name}</b><div class="small mut" style="text-align:right">${own} / ${all.length} owned</div></div>
    <div class="bar" style="margin:8px 0 10px"><div style="width:${own/all.length*100}%;background:${c.color}"></div></div>
    <div class="seg">${[1,2,3].map(l=>`<button class="${S.levels[c.id]===l?"on":""}" data-lvl="${c.id}:${l}">${D.levels[l]}</button>`).join("")}</div></div>`;
  });
  const dn=Object.values(S.done).filter(Boolean).length;
  h+=`<div class="card"><b>12-week program</b><div class="small mut">${dn} of 36 sessions done</div></div><button class="btn ghost" id="reset">Reset all progress</button>`;
  return h;
}

/* ---------- ABOUT ---------- */
function about(){
  return `<h2>About</h2><div class="card"><b>How to use it</b><ul class="small"><li><b>Today</b>: tick areas, pick a length, get a session built from your levels. Flips stay as drills until you tick the move listed under "Own this first".</li><li><b>12 Weeks</b>: the add-on program - 3 sessions a week, deloads in weeks 4 and 8, test week 12.</li><li><b>Library</b>: every move with cues, mistakes, a progression and an easier option.</li><li><b>Progress</b>: your level per area and the moves you own.</li></ul></div>
  <div class="card"><b>Safety</b><ul class="small">${D.safety.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
  <div class="card"><b>Sources</b>${D.sources.map(s=>`<div style="margin-top:10px"><div>${esc(s.author)}</div><div class="small mut">${s.works.map(esc).join(" · ")}</div></div>`).join("")}</div>
  <div class="ai">${esc(D.aiNote)}</div>`;
}

function render(){nav();$("#view").innerHTML=({today,program,library,progress,about})[S.tab]();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-pick],[data-mins],[data-week],[data-lib],[data-mv],[data-lvl],#build,#build2,#reset,#closeM");
  if(!t){if(e.target.id==="modal"){$("#modal").classList.remove("open");render()}return}
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;window.scrollTo(0,0)}
  else if(d.pick){S.pick=S.pick.includes(d.pick)?S.pick.filter(x=>x!==d.pick):[...S.pick,d.pick]}
  else if(d.mins){S.mins=+d.mins}
  else if(d.week){S.week=+d.week}
  else if(d.lib){S.libCat=d.lib}
  else if(d.mv){openMove(d.mv);return}
  else if(d.lvl){const[c,l]=d.lvl.split(":");S.levels[c]=+l}
  else if(t.id==="build"||t.id==="build2"){buildSession()}
  else if(t.id==="reset"){if(confirm("Reset all progress?")){S.mastered={};S.done={};S.built=null}}
  else if(t.id==="closeM"){$("#modal").classList.remove("open");render();return}
  save();render();
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d.done){S.done[d.done]=e.target.checked;save();render()}
  if(d.mast){S.mastered[d.mast]=e.target.checked;save();const y=window.scrollY;render();window.scrollTo(0,y)}
});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
