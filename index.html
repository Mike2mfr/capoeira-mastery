n).", "safety": ["Treine acrobacias na grama ou num colchão grosso, nunca em chão duro, e nunca no fim de um dia pesado de pernas.", "Primeiras tentativas completas de macaco, aú sem mão, mortal, folha seca e S-dobrado: tenha alguém ajudando, de preferência um professor de capoeira ou de acrobacia.", "Os chutes são treinados com controle: velocidade máxima só no ar, no saco ou num alvo segurado - nunca num parceiro.", "Quedas (rasteira, tesoura, vingativa) e cabeçada são treinadas sozinho ou devagar com um parceiro disposto, num colchão.", "Floreios de cabeça (aú de cabeça, pião de cabeça): a maior parte do peso nas mãos, touca ou boné para os giros, pare a qualquer dor no pescoço.", "Se algo doer (punhos, pescoço, lombar), use a opção mais fácil indicada em cada movimento."], "sources": [{"author": "Mestre Bimba (Manoel dos Reis Machado)", "works": ["Sequências de Ensino da Capoeira Regional"]}, {"author": "Mestre Pastinha (Vicente Ferreira Pastinha)", "works": ["Capoeira Angola (1964)"]}, {"author": "Nestor Capoeira", "works": ["The Little Capoeira Book", "Capoeira: Roots of the Dance-Fight-Game"]}, {"author": "Mestre Acordeon (Bira Almeida)", "works": ["Capoeira: A Brazilian Art Form"]}], "aiNote": "Este app e o manual foram criados com a ajuda de IA (Claude, da Anthropic). Eles não substituem um professor de capoeira - entre numa roda sempre que puder."}, "fr": {"cats": [{"id": "fund", "name": "Bases", "en": "Fundamentos", "color": "#f5c542", "intro": "La ginga, les positions basses et les esquives au sol. Tout en capoeira part de là, c'est pourquoi ils reviennent à chaque séance du programme."}, {"id": "atk", "name": "Attaque", "en": "Ataques", "color": "#ff5a4e", "intro": "Coups de pied, balayages et projections. Les coups de pied de capoeira sont surtout circulaires et sortent de la ginga ; travaille-les d'abord lentement et contrôlés, puis avec vitesse."}, {"id": "def", "name": "Défense", "en": "Defesas", "color": "#4ea8ff", "intro": "La capoeira se défend en sortant de la trajectoire (esquivas) et en restant bas, rarement en bloquant. Une bonne défense finit toujours dans une position d'où tu peux contre-attaquer."}, {"id": "flo", "name": "Floreios", "en": "Figures", "color": "#b36bff", "intro": "Équilibres sur les mains et rotations, pour montrer son niveau, changer de hauteur et enchaîner entre les attaques. Ta base en équilibre sur les mains te donne une grosse longueur d'avance ici."}, {"id": "flip", "name": "Acrobaties", "en": "Acrobacias", "color": "#3fd18b", "intro": "Mouvements aériens et renversements. Entraîne-les sur l'herbe ou un tapis épais, jamais fatigué, et avec une parade pour les premiers essais complets. Chacun indique le mouvement à maîtriser avant."}], "levels": {"1": "Débutant", "2": "Intermédiaire", "3": "Avancé"}, "moves": [{"id": "ginga", "name": "Ginga", "cat": "fund", "lvl": 1, "en": "Le balancement", "what": "Le pas de balancement permanent de la capoeira : un pas en triangle d'un côté à l'autre, une jambe en arrière à la fois, le bras opposé qui protège le visage. Il te garde en mouvement, cache ton prochain mouvement et prépare chaque coup de pied et chaque esquive.", "cues": ["Pieds à largeur d'épaules ; le pied arrière recule en diagonale, jamais droit derrière.", "Genoux fléchis en permanence - la tête ne doit pas monter et descendre.", "Le bras du côté de la jambe avant passe devant le visage.", "Buste légèrement en avant au-dessus du genou avant ; poids sur l'avant des pieds."], "mistakes": ["Rester grand et jambes raides.", "Reculer droit derrière, la base devient étroite.", "Baisser le bras de garde.", "Regarder le sol."], "drills": ["Triangle statique : pose le pied dans chaque coin et tiens 3 s.", "Ginga lente sur 4 temps, 2 minutes.", "Ginga avec une base plus large et plus basse (cuisses presque parallèles).", "Ginga en cercle en changeant de rythme (lent, rapide, cassé)."], "alt": "Pas plus court et base plus haute le temps que les jambes s'adaptent."}, {"id": "cocorinha", "name": "Cocorinha", "cat": "fund", "lvl": 1, "en": "Petit accroupi", "what": "Un accroupi complet talons au sol, un bras qui protège la tête. La première défense contre les coups de pied hauts et la position basse de nombreuses transitions.", "cues": ["Talons à plat, genoux ouverts au-dessus des orteils.", "Bras de garde plié au-dessus de la tête, l'autre main peut toucher le sol.", "Yeux sur l'adversaire - tête levée."], "mistakes": ["Talons qui décollent.", "Rentrer la tête entre les genoux.", "S'effondrer vers l'avant sur les mains."], "drills": ["Accroupi profond tenu, 3 x 30 s.", "Ginga vers cocorinha et retour, 10 de chaque côté.", "Cocorinha en déplacement - avance de côté en restant bas."], "alt": "Talons sur une petite cale ou un disque le temps que la mobilité de cheville progresse."}, {"id": "negativa", "name": "Negativa", "cat": "fund", "lvl": 1, "en": "La négative", "what": "Une position basse sur une jambe pliée, l'autre tendue au sol, une main au sol et l'autre qui protège le visage. Une défense, une base au sol et le départ du rolê et de la rasteira.", "cues": ["Jambe d'appui complètement pliée, pied à plat.", "Jambe tendue droite, pied fléchi, posé sur le talon ou le bord du pied.", "Main d'appui à côté de la hanche, pas derrière toi.", "Buste tourné vers la jambe tendue, bras de garde levé."], "mistakes": ["S'asseoir au sol.", "Main trop en arrière, la poitrine s'ouvre vers le ciel.", "Jambe tendue qui plie."], "drills": ["Ginga vers negativa, 8 par côté lentement.", "Changements de negativa : passe d'un côté à l'autre en restant bas.", "Enchaînement negativa - rolê - ginga."], "alt": "Pose la main sur une brique de yoga pour surélever le sol."}, {"id": "role", "name": "Rolê", "cat": "fund", "lvl": 1, "en": "La roulade de fuite", "what": "Un déplacement bas en tournant sur les mains et les pieds, pour s'échapper et changer de côté. Depuis la negativa tu tournes sur les deux mains et reviens face à l'adversaire.", "cues": ["Les deux mains posées, hanches basses.", "La tête tourne d'abord, les hanches suivent.", "Termine en negativa ou en ginga, de face."], "mistakes": ["Hanches trop hautes (ça devient une marche de l'ours).", "Perdre l'adversaire de vue trop longtemps."], "drills": ["Rolê depuis la negativa, 6 de chaque côté.", "Rolês enchaînés à travers la pièce, aller-retour.", "Rolê vers aú."], "alt": "Fais la rotation en deux temps : les mains d'abord, puis les pieds."}, {"id": "au", "name": "Aú", "cat": "fund", "lvl": 1, "en": "Roue de capoeira", "what": "Une roue les yeux sur l'adversaire, jambes légèrement pliées ou ouvertes, souvent plus lente et contrôlée qu'une roue de gym. Sert à entrer et sortir du jeu.", "cues": ["Regarde entre tes mains, vers l'adversaire, pas le sol.", "Les mains se posent l'une après l'autre, en ligne.", "Jambes bien ouvertes en haut, pointes de pieds actives.", "Réception en ginga ou en negativa, prêt."], "mistakes": ["Regarder le sol.", "Casser aux hanches, l'aú devient un petit saut.", "Atterrir droit, pieds à plat."], "drills": ["Aú bas jambes pliées par-dessus une ligne.", "Aú à gauche et à droite, 6 de chaque.", "Aú lent avec 1 s de pause sur les mains.", "Aú vers negativa."], "alt": "Aú bas jambes pliées ou passage de jambes sur le côté."}, {"id": "queda4", "name": "Queda de quatro", "cat": "fund", "lvl": 1, "en": "Chute à quatre pattes", "what": "Tomber en arrière en s'asseyant, mains derrière et pieds devant - une fuite d'urgence et la base du macaco.", "cues": ["Les mains se posent derrière les hanches, doigts vers l'extérieur ou l'arrière.", "Les hanches restent décollées du sol.", "Remonte par la cocorinha ou un rolê."], "mistakes": ["Coudes verrouillés à la réception.", "S'asseoir complètement."], "drills": ["Accroupi vers queda de quatro, 10 répétitions.", "Queda de quatro en marchant en avant et en arrière.", "Queda de quatro vers poussée en pont (préparation du macaco)."], "alt": "Descends lentement depuis l'accroupi au lieu de tomber."}, {"id": "ponte", "name": "Ponte", "cat": "fund", "lvl": 2, "en": "Pont", "what": "L'extension arrière qui ouvre épaules et colonne pour le macaco, l'aú de cabeça et les renversements. Travaillé ici comme une mobilité quotidienne.", "cues": ["Pousse le sol jusqu'à avoir les bras tendus.", "Épaules au-dessus des poignets, pas derrière.", "Serre légèrement les fessiers, genoux dans l'axe des pieds."], "mistakes": ["Ne plier que le bas du dos.", "Pieds très ouverts vers l'extérieur."], "drills": ["Glissés au mur bras au-dessus de la tête, 2 x 10.", "Pont tenu 3 x 20 s, pieds sur une marche si besoin.", "Balancements en pont (épaules au-dessus des mains).", "Descente en pont le long d'un mur."], "alt": "Pont pieds surélevés ou position de table."}, {"id": "meialua_frente", "name": "Meia-lua de frente", "cat": "atk", "lvl": 1, "en": "Demi-lune de face", "what": "Un coup de pied circulaire de l'extérieur vers l'intérieur, jambe tendue, devant le corps. En général le premier coup de pied appris.", "cues": ["Le coup part de la jambe arrière de la ginga.", "Jambe tendue, cercle de l'extérieur vers l'intérieur à hauteur de tête.", "Le talon d'appui pivote un peu ; la garde reste haute.", "Reviens en ginga - ne laisse pas la jambe tomber et rester."], "mistakes": ["Plier le genou.", "Se pencher loin en arrière.", "Frapper sans revenir en ginga."], "drills": ["Coups au ralenti en touchant une main tenue à hauteur d'épaule.", "10 par côté depuis la ginga.", "Double meia-lua (une de chaque jambe) en rythme."], "alt": "Moins haut (ceinture) le temps que la mobilité de hanche permette plus."}, {"id": "queixada", "name": "Queixada", "cat": "atk", "lvl": 1, "en": "Coup au menton", "what": "Un coup de pied circulaire de l'intérieur vers l'extérieur : tu croises le pied avant, tu tournes les hanches et la jambe arrière tourne vers l'extérieur.", "cues": ["Fais le pas en diagonale pour fermer les hanches d'abord.", "La jambe qui frappe monte en croisant le corps et s'ouvre vers l'extérieur.", "Le haut du corps se penche un peu de l'autre côté en contrepoids."], "mistakes": ["Pas de pas - frapper depuis une base de face.", "Agiter les bras dans tous les sens."], "drills": ["Pas + tenir la position, puis frapper lentement.", "8 par côté depuis la ginga.", "Queixada vers esquiva lateral."], "alt": "Version genou plié à hauteur de ceinture."}, {"id": "armada", "name": "Armada", "cat": "atk", "lvl": 1, "en": "Coup de pied retourné", "what": "Un coup de pied retourné vers l'extérieur : croise le pas, tourne brièvement le dos, regarde par-dessus l'épaule et balaye avec la jambe tendue.", "cues": ["Croise le pied avant, pivote sur l'avant des pieds.", "La tête et les yeux tournent d'abord - repère la cible par-dessus l'épaule.", "Jambe qui frappe tendue, hanches droites.", "Termine de face, en ginga."], "mistakes": ["Tourner à l'aveugle (jambe avant les yeux).", "Perdre l'équilibre dans la rotation.", "Coup trop bas et plié."], "drills": ["Rotation à vide sans frapper, 10 de chaque côté.", "Armada en touchant une cible (main/sac).", "Armada vers negativa."], "alt": "Demi-tour sans l'extension complète de la jambe."}, {"id": "bencao", "name": "Bênção", "cat": "atk", "lvl": 1, "en": "Bénédiction / coup de pied de poussée de face", "what": "Un coup de pied direct en poussée avec la plante du pied dans la poitrine ou le ventre, pour repousser l'adversaire.", "cues": ["Monte d'abord le genou, puis pousse avec le talon.", "Les hanches poussent vers l'avant à la fin.", "Ramène la jambe en ginga."], "mistakes": ["Fouetter la jambe (c'est une poussée, pas un fouetté).", "Se pencher trop en arrière."], "drills": ["Montée de genou + extension lente, 8 par côté.", "Bênção contre un mur ou un sac.", "Bênção, pas en avant et ginga."], "alt": "Cible plus basse."}, {"id": "martelo", "name": "Martelo", "cat": "atk", "lvl": 2, "en": "Coup de pied marteau", "what": "Un coup de pied circulaire qui frappe avec le cou-de-pied - rapide et direct, plus proche d'un coup d'art martial que des coups circulaires de capoeira.", "cues": ["Pivote le pied d'appui.", "Le genou monte et croise, puis le tibia fouette.", "Garde haute, yeux sur la cible."], "mistakes": ["Ne pas pivoter le pied d'appui (contrainte sur le genou).", "Baisser la garde."], "drills": ["Armer + tendre lentement, 6 par côté.", "Martelo sur un sac ou une cible tenue.", "Échelle de martelo bas-milieu-haut."], "alt": "Martelo à hauteur de genou."}, {"id": "chapa", "name": "Chapa", "cat": "atk", "lvl": 1, "en": "Coup de pied latéral en poussée", "what": "Un coup de pied latéral ou arrière en poussée avec la plante du pied, souvent depuis une position basse ou de dos.", "cues": ["Arme le genou vers la poitrine.", "Pousse le talon sur le côté, orteils légèrement vers le bas.", "Regarde la cible par-dessus l'épaule."], "mistakes": ["Se pencher au point de perdre la garde.", "Frapper avec les orteils."], "drills": ["Armer + pousser, 8 par côté.", "Chapa de costas (coup de pied arrière) depuis la ginga.", "Chapa baixa depuis le sol (mains au sol)."], "alt": "Main au mur pour l'équilibre."}, {"id": "compasso", "name": "Meia-lua de compasso", "cat": "atk", "lvl": 2, "en": "Demi-lune compas", "what": "Le coup de pied emblématique de la capoeira : les mains vont au sol et tu tournes, en balayant avec le talon dans un grand arc. Aussi appelé rabo de arraia.", "cues": ["Croise le pas, les deux mains au sol à côté du pied avant.", "Regarde la cible sous ton bras pendant toute la rotation.", "Le talon mène, jambe tendue, hanches qui tournent complètement.", "Termine en ginga, garde haute."], "mistakes": ["Perdre la cible de vue.", "Mains trop loin du pied.", "Plier la jambe qui frappe."], "drills": ["Position mains au sol + rotation lente.", "Compasso vers une cible à hauteur de ceinture.", "Compasso à pleine vitesse, 6 par côté.", "Compasso vers rolê."], "alt": "Coup plus bas et rotation plus lente."}, {"id": "rasteira", "name": "Rasteira", "cat": "atk", "lvl": 2, "en": "Balayage", "what": "Un balayage bas depuis la negativa : la jambe tendue crochète derrière le pied d'appui de l'adversaire et le tire. Travaille-le sur la cheville d'un partenaire ou un plot.", "cues": ["Entre bas en negativa à côté du pied de l'adversaire.", "Crochète avec le pied ou la cheville, tire vers toi.", "Garde la main au sol et la garde haute."], "mistakes": ["Frapper la cheville au lieu de crocheter.", "Entrer debout."], "drills": ["Negativa glissée jusqu'à un plot, 8 par côté.", "Rasteira sur un plot ou une bouteille d'eau.", "Enchaînement ginga - esquiva - rasteira en contre."], "alt": "Travaille seulement l'entrée en negativa."}, {"id": "tesoura", "name": "Tesoura", "cat": "atk", "lvl": 2, "en": "Ciseaux", "what": "Une projection où tu bloques les jambes de l'adversaire entre les tiennes depuis une position basse. Travaille l'entrée seul et la finition uniquement avec un partenaire d'accord, sur un tapis.", "cues": ["Entre bas depuis la negativa ou un aú.", "Les jambes se ferment comme des ciseaux à hauteur de genou.", "Tourne les hanches pour finir."], "mistakes": ["Plonger la tête la première.", "Tordre le genou du partenaire - toujours lentement."], "drills": ["Formes d'entrée de la tesoura dans le vide, 6 par côté.", "Tesoura sur un tapis roulé.", "Tesoura depuis un aú (avancé)."], "alt": "Formes seul uniquement."}, {"id": "vingativa", "name": "Vingativa", "cat": "atk", "lvl": 2, "en": "La revanche", "what": "Une projection de hanche depuis une position basse : tu passes derrière la jambe de l'adversaire et tu le pousses en arrière par-dessus avec ton corps.", "cues": ["Avance profond à côté et derrière sa jambe.", "Épaule et hanche poussent en arrière et en travers."], "mistakes": ["Rester trop loin.", "Pousser seulement avec les bras."], "drills": ["Entrée de vingativa dans le vide, 8 par côté.", "Vingativa sur un sac lourd ou un partenaire, lentement."], "alt": "Entrée seul uniquement."}, {"id": "pulada", "name": "Armada pulada", "cat": "atk", "lvl": 3, "en": "Armada sautée", "what": "Une version sautée de l'armada : décolle pendant la rotation et frappe en l'air, réception sur la jambe qui frappe ou sur les deux pieds.", "cues": ["D'abord une armada rapide et propre.", "Monte le genou de la jambe libre pour t'élever.", "Repère la réception, atterris en douceur en ginga."], "mistakes": ["Sauter sans assez de rotation.", "Atterrir genoux tendus."], "drills": ["Armada avec un petit saut.", "Sauts en rotation (360) réception équilibrée.", "Armada pulada complète sur l'herbe."], "alt": "Armada rapide debout.", "pre": "armada"}, {"id": "martelo_rodado", "name": "Martelo rodado", "cat": "atk", "lvl": 3, "en": "Marteau retourné", "what": "Un martelo sauté et retourné : tourne comme une armada, puis fouette l'autre jambe comme un martelo en l'air.", "cues": ["Rotation puissante, style armada.", "Change de jambe en l'air - la deuxième jambe frappe.", "Atterris d'abord sur la jambe qui frappe."], "mistakes": ["Pas assez de hauteur.", "Frapper avec la mauvaise jambe."], "drills": ["Sauts 360 avec montée de genou.", "Enchaînement armada + martelo sans saut.", "Martelo rodado sur l'herbe."], "alt": "Armada + martelo au sol.", "pre": "armada"}, {"id": "parafuso", "name": "Parafuso", "cat": "atk", "lvl": 3, "en": "La vis", "what": "Un coup de pied sauté en rotation sur un axe vertical : tu décolles d'un tour, tu tournes en l'air et fouettes la jambe en haut - le grand frère du martelo rodado. (L'acrobatie horizontale, proche du B-twist, c'est le S-dobrado, dans Acrobaties.)", "cues": ["Prépare avec un pas croisé et un fort balancé de bras dans le sens de la rotation.", "Saute droit vers le haut - le corps reste vertical.", "Repère la cible par-dessus l'épaule, puis fouette la jambe.", "Atterris sur la jambe qui frappe, genou souple."], "mistakes": ["Se pencher ou se déplacer de côté en l'air.", "Balancé de bras faible, donc pas assez de rotation."], "drills": ["Sauts en rotation 360 réception équilibrée.", "Martelo rodado propre des deux côtés.", "Parafuso sur l'herbe, bas puis à pleine hauteur."], "alt": "Martelo rodado.", "pre": "martelo_rodado"}, {"id": "cabecada", "name": "Cabeçada", "cat": "atk", "lvl": 1, "en": "Coup de tête", "what": "Un coup de tête dans la poitrine depuis une entrée basse. Travaillé seul ou au sac pour apprendre l'entrée - jamais en contact plein sur un partenaire.", "cues": ["Abaisse le corps et entre.", "Cou verrouillé, frappe avec le haut du front.", "Les bras protègent le visage."], "mistakes": ["Entrer avec le visage en avant.", "Cou relâché."], "drills": ["Exercice d'entrée depuis la ginga, 8 répétitions.", "Cabeçada légère sur un pao ou un sac."], "alt": "Seulement le jeu de jambes de l'entrée."}, {"id": "esq_lateral", "name": "Esquiva lateral", "cat": "def", "lvl": 1, "en": "Esquive latérale", "what": "Descends sur le côté et bas, une main au sol et le bras de garde levé, en laissant passer un coup circulaire au-dessus.", "cues": ["Fais un pas sur le côté et plie le genou de ce côté.", "Main au sol à côté du pied, l'autre bras en garde.", "Yeux sur le coup."], "mistakes": ["Rester trop haut.", "Tourner le dos."], "drills": ["Ginga vers esquiva lateral, 10 par côté.", "Esquiva + retour en ginga en rythme.", "Esquiva lateral contre la meia-lua lente d'un partenaire."], "alt": "Esquive plus petite, mains sur les genoux.", "defends": ["meialua_frente", "armada", "queixada", "compasso"]}, {"id": "esq_baixa", "name": "Esquiva baixa", "cat": "def", "lvl": 1, "en": "Esquive basse", "what": "Depuis la ginga, descends bas, buste en avant au-dessus de la jambe avant et bras qui protège la tête.", "cues": ["Descends au-dessus de la jambe avant, buste bas.", "Jambe arrière tendue derrière.", "La main protège la tête."], "mistakes": ["Courber le dos sans plier les jambes."], "drills": ["Ginga vers esquiva baixa, 10 par côté.", "Esquiva baixa + contre en armada."], "alt": "Esquive plus haute.", "defends": ["armada", "compasso", "martelo"]}, {"id": "esq_frente", "name": "Esquiva de frente", "cat": "def", "lvl": 1, "en": "Esquive de face", "what": "Plonge vers l'avant et vers le bas, sous un coup direct ou haut, prêt à contre-attaquer.", "cues": ["Penche-toi en avant depuis les hanches, genoux pliés.", "Les deux bras en garde.", "Ressors prêt à frapper ou à rouler."], "mistakes": ["Regarder le sol.", "Genoux verrouillés."], "drills": ["Ginga + plongée, 10 répétitions.", "Plongée + entrée de cabeçada."], "alt": "Plongée plus petite.", "defends": ["bencao", "martelo", "queixada"]}, {"id": "cocorinha_def", "name": "Cocorinha (defesa)", "cat": "def", "lvl": 1, "en": "Esquive accroupie", "what": "La cocorinha comme défense : descends droit sous un coup haut, le bras qui protège la tête.", "cues": ["Descends vite, talons au sol.", "Bras de garde haut.", "Remonte d'un coup en ginga."], "mistakes": ["Descendre trop tard.", "Se pencher en arrière."], "drills": ["À deux ou dans le vide : le coup passe, tu descends, 10 répétitions.", "Cocorinha + contre en rasteira."], "alt": "Demi-accroupi.", "defends": ["armada", "meialua_frente"]}, {"id": "negativa_def", "name": "Negativa (defesa)", "cat": "def", "lvl": 1, "en": "Negativa en défense", "what": "Aller en negativa pour échapper à un coup, en restant bas et prêt pour la rasteira ou le rolê.", "cues": ["Descends et tends la jambe vers l'attaquant.", "Main au sol, garde haute.", "Tourne le buste vers l'attaquant."], "mistakes": ["Finir dos à l'attaquant."], "drills": ["Ginga vers negativa au signal, 10 répétitions.", "Negativa + contre en rasteira."], "alt": "Negativa plus haute avec une brique sous la main.", "defends": ["compasso", "armada", "martelo"]}, {"id": "role_def", "name": "Rolê (fuga)", "cat": "def", "lvl": 1, "en": "Fuite en roulant", "what": "Rouler au sol pour s'éloigner de la pression et revenir face à l'adversaire à bonne distance.", "cues": ["Bas et rapide.", "Regarde vite derrière."], "mistakes": ["Rouler vers l'attaquant."], "drills": ["Enchaînement negativa - rolê - ginga, 6 fois.", "Rolê pour fuir un partenaire qui pousse."], "alt": "Rolê lent.", "defends": ["bencao", "chapa"]}, {"id": "resistencia", "name": "Resistência", "cat": "def", "lvl": 2, "en": "Résistance", "what": "Une défense basse, corps penché en arrière en appui sur une main, près de l'adversaire, en laissant passer le coup juste au-dessus. Mène directement à la rasteira et à la vingativa.", "cues": ["Hanches près du sol, main d'appui derrière.", "Corps très près de l'attaquant.", "Bras de garde levé."], "mistakes": ["S'asseoir.", "Se pencher si loin qu'on ne peut plus revenir."], "drills": ["Resistência tenue, 5 x 10 s par côté.", "Resistência vers contre en rasteira.", "Resistência vers entrée de vingativa."], "alt": "Esquiva lateral.", "defends": ["queixada", "armada", "martelo"]}, {"id": "cruz", "name": "Cruz / bloqueio", "cat": "def", "lvl": 2, "en": "Blocage", "what": "Une défense en blocage avec les avant-bras croisés ou un seul avant-bras, uniquement quand tu ne peux pas échapper à un coup direct et rapide.", "cues": ["Avant-bras gainés, coudes pliés.", "Bloque et tourne le corps pour dévier, pas pour encaisser."], "mistakes": ["Bloquer mains ouvertes.", "Rester immobile après le blocage."], "drills": ["Blocages dans le vide, 10 répétitions.", "Blocages légers contre la bênção lente d'un partenaire."], "alt": "Esquive plutôt.", "defends": ["bencao", "martelo", "chapa"]}, {"id": "contra", "name": "Esquiva + contra-ataque", "cat": "def", "lvl": 2, "en": "Esquive et contre-attaque", "what": "Le vrai but de la défense : chaque esquiva enchaîne sur une attaque. Paires classiques : esquiva lateral - meia-lua de compasso ; cocorinha - rasteira ; negativa - rolê - armada.", "cues": ["Ne jamais se figer dans la défense.", "Contre avec la jambe déjà chargée.", "Reste bas jusqu'à ce que la jambe de l'attaquant soit passée."], "mistakes": ["Remonter trop tôt.", "Contre-attaquer depuis une position sans équilibre."], "drills": ["Exercice de paires : 5 répétitions de chaque paire défense-contre.", "Jeu dans le vide 2 x 2 min.", "Jeu avec partenaire à vitesse lente."], "alt": "Fais les paires séparément, lentement.", "defends": ["meialua_frente", "armada", "queixada", "compasso", "martelo"]}, {"id": "queda_rins", "name": "Queda de rins", "cat": "flo", "lvl": 1, "en": "Chute sur les reins", "what": "Un équilibre bas sur une ou deux mains, le coude calé sur le côté de la taille et les jambes décollées, la tête près du sol. Une pause entre les mouvements et la base de nombreux floreios.", "cues": ["Coude contre l'os de la hanche, juste sous les côtes.", "Tête au sol ou près du sol comme troisième appui au début.", "Jambes groupées, puis tendues."], "mistakes": ["Le coude qui glisse sur le ventre.", "Tout le poids sur la tête."], "drills": ["Trépied tête au sol, 3 x 15 s.", "Queda de rins jambes groupées, 3 x 10 s par côté.", "Queda de rins jambes tendues.", "Queda de rins depuis la ginga et retour."], "alt": "Garde la tête et les pointes de pieds au sol."}, {"id": "bananeira", "name": "Bananeira", "cat": "flo", "lvl": 1, "en": "Équilibre sur les mains", "what": "L'équilibre sur les mains de la capoeira - plus vivant que la version gym, jambes pliées, en marchant et en regardant devant. Ton équilibre solide en fait une victoire rapide.", "cues": ["Regarde devant, vers l'adversaire, pas le sol.", "Les jambes peuvent être pliées ou ouvertes - reste en équilibre.", "Marche dans toutes les directions."], "mistakes": ["Ligne parfaite de gym mais aucune attention à l'adversaire."], "drills": ["Marche en bananeira 3 x 5 m.", "Bananeira avec formes de jambes (ouvertes, en biche, pliées).", "Bananeira vers queda de rins."], "alt": "Montée au mur ou corbeau."}, {"id": "au_fechado", "name": "Aú fechado", "cat": "flo", "lvl": 1, "en": "Roue fermée", "what": "Un aú lent jambes pliées et groupées, en restant protégé ; souvent avec une pause au milieu comme un équilibre.", "cues": ["Genoux pliés et serrés.", "Pause au-dessus des mains.", "Yeux devant."], "mistakes": ["Se précipiter.", "Jambes qui s'ouvrent trop."], "drills": ["Aú fechado lent avec 2 s de pause, 6 par côté.", "Aú fechado vers queda de rins."], "alt": "Aú bas."}, {"id": "au_cabeca", "name": "Aú de cabeça", "cat": "flo", "lvl": 2, "en": "Roue sur la tête", "what": "Une roue qui passe par un équilibre sur la tête - la tête reste au sol pendant que les jambes passent par-dessus.", "cues": ["Base en triangle : tête et deux mains.", "Les jambes passent lentement par-dessus.", "Cou solide, l'essentiel du poids sur les mains."], "mistakes": ["Tout le poids sur la tête.", "Rouler sur la nuque."], "drills": ["Équilibre sur la tête en trépied, 3 x 20 s.", "Passages de jambes en trépied, à mi-chemin, 6 par côté.", "Aú de cabeça complet."], "alt": "Seulement l'équilibre sur la tête en trépied."}, {"id": "piao_cabeca", "name": "Pião de cabeça", "cat": "flo", "lvl": 2, "en": "Toupie sur la tête", "what": "Une rotation sur la tête depuis le trépied, jambes ouvertes. Utilise une casquette ou un bonnet et un sol lisse.", "cues": ["Base en trépied, pousse avec les mains pour tourner.", "Jambes bien ouvertes pour l'équilibre.", "Rotations courtes au début."], "mistakes": ["Tourner sur la nuque.", "Sol dur et pas de protection pour la tête."], "drills": ["Trépied tenu jambes ouvertes.", "Quarts de tour en poussant avec les mains.", "2-3 rotations."], "alt": "Trépied avec formes de jambes."}, {"id": "au_batido", "name": "Aú batido", "cat": "flo", "lvl": 2, "en": "Roue frappée", "what": "Un aú sur une main avec une pause au milieu et un coup de la jambe du haut (comme une chapa ou un martelo). Construit l'appui sur un bras des floreios avancés.", "cues": ["Appui sur un bras, épaule au-dessus de la main.", "La jambe du haut frappe pendant que celle du bas équilibre.", "Reviens au sol en douceur."], "mistakes": ["Épaule effondrée.", "Frapper trop tôt."], "drills": ["Aú sur une main, 6 par côté.", "Aú en pause sur une main, 3 x 5 s par côté.", "Aú batido complet."], "alt": "Aú sur une main sans le coup."}, {"id": "macaco", "name": "Macaco", "cat": "flip", "lvl": 2, "en": "Le singe", "what": "Un renversement arrière depuis un accroupi bas par-dessus une main : assieds-toi en arrière, tends un bras derrière, pousse avec les jambes et fais passer les hanches. Tu l'as noté comme difficile - il est construit étape par étape dans le programme.", "cues": ["Pars bas, une main derrière toi, le bras opposé au-dessus de la tête.", "Pousse fort les hanches vers le haut avec les jambes.", "La tête regarde en arrière vers la main.", "La deuxième main et les pieds se posent en accroupi."], "mistakes": ["Pas assez de poussée de hanches.", "Lancer la tête avant les hanches.", "Main posée trop loin derrière."], "drills": ["Queda de quatro vers poussée en pont, 3 x 8.", "Macaco par-dessus un tapis roulé ou un dossier de canapé.", "Macaco avec parade sur l'herbe.", "Macaco depuis la cocorinha."], "alt": "Poussée de hanches en pont depuis la queda de quatro."}, {"id": "au_quebrado", "name": "Aú quebrado", "cat": "flo", "lvl": 3, "en": "Roue cassée", "what": "Un équilibre sur un bras où le corps se cambre et les jambes tombent derrière la tête, tenu sur le coude calé sur le côté comme une queda de rins en l'air. Avancé et très dépendant des épaules.", "cues": ["Coude sur le côté comme en queda de rins.", "Cambre le dos et laisse passer les jambes.", "Yeux sur le sol devant."], "mistakes": ["Forcer le dos sans ouverture d'épaules."], "drills": ["Queda de rins jambes tendues, maintiens longs.", "Queda de rins vers la forme cambrée.", "Aú quebrado tenu 3 s."], "alt": "Queda de rins avec formes de jambes.", "pre": "queda_rins"}, {"id": "piao_mao", "name": "Pião de mão", "cat": "flo", "lvl": 3, "en": "Toupie sur la main", "what": "Tourner sur une main en équilibre bras plié ou tendu - ton travail d'équilibre sur un bras y mène directement.", "cues": ["Main tournée vers l'extérieur, doigts écartés.", "Jambes ouvertes pour l'équilibre et la rotation.", "Tourne avec les hanches, pas avec le bras."], "mistakes": ["Tourner depuis l'épaule."], "drills": ["Queda de rins sur une main, 3 x 5 s.", "Quarts de tour sur une main.", "Tour complet."], "alt": "Pião à deux mains (en alternant les mains).", "pre": "au_batido"}, {"id": "relogio", "name": "Relógio", "cat": "flo", "lvl": 3, "en": "L'horloge", "what": "Une rotation sur une main en position de queda de rins, corps horizontal, qui tourne comme l'aiguille d'une horloge.", "cues": ["Queda de rins solide jambes tendues.", "Pousse le sol avec la main libre pour démarrer.", "Tête décollée du sol."], "mistakes": ["Laisser tomber les hanches."], "drills": ["Queda de rins tête décollée.", "Quarts de tour en queda de rins.", "Relógio complet."], "alt": "Queda de rins tenue.", "pre": "queda_rins"}, {"id": "jump_tuck", "name": "Salto grupado", "cat": "flip", "lvl": 1, "en": "Base du saut groupé", "what": "La base de saut de toutes les acrobaties : saut vertical maximal avec genoux à la poitrine rapides, réception souple.", "cues": ["Les bras montent fort.", "Genoux à la poitrine en haut.", "Réception genoux pliés et pieds silencieux."], "mistakes": ["Sauter en avant au lieu de vers le haut.", "Réceptions dures."], "drills": ["Sauts groupés 3 x 6.", "Sauts groupés depuis l'accroupi profond.", "Saut groupé avec demi-tour."], "alt": "Squat jumps."}, {"id": "au_uma_mao", "name": "Aú de uma mão", "cat": "flip", "lvl": 1, "en": "Roue sur une main", "what": "Un aú en ne posant que la main éloignée - l'étape vers l'aú sem mão.", "cues": ["Fort lancer de la jambe arrière.", "Seulement la main éloignée, près du pied avant.", "Le buste reste haut."], "mistakes": ["Main trop loin."], "drills": ["Aú bas sur une main, 6 par côté.", "Aú sur une main rapide.", "Aú sur une main du bout des doigts seulement."], "alt": "Aú normal."}, {"id": "macaco_pe", "name": "Macaco em pé", "cat": "flip", "lvl": 2, "en": "Macaco debout", "what": "Le macaco depuis la position debout : tu t'assieds en arrière en accroupi bas, la main déjà en route, et tu enchaînes directement le renversement.", "cues": ["D'abord un macaco propre.", "Assieds-toi vite en arrière et garde les yeux sur la main.", "Forte poussée de hanches."], "mistakes": ["S'arrêter en bas."], "drills": ["Macaco depuis la cocorinha, 5 par côté.", "Macaco em pé sur l'herbe, avec parade."], "alt": "Macaco depuis le sol.", "pre": "macaco"}, {"id": "au_sem_mao", "name": "Aú sem mão", "cat": "flip", "lvl": 3, "en": "Roue sans les mains", "what": "Une roue sans les mains. Construite depuis l'aú sur une main avec une poussée de jambes rapide, buste haut.", "cues": ["Grand pas, fort lancer de la jambe arrière.", "Buste haut, tête neutre.", "Les bras balancent et ne gênent pas.", "Réception un pied après l'autre."], "mistakes": ["Jeter la tête vers le bas.", "Pas court et pas de poussée de jambes."], "drills": ["Aú sur une main rapide du bout des doigts.", "Aú sem mão en descente sur l'herbe.", "Aú sem mão sur l'herbe avec une parade aux hanches."], "alt": "Aú du bout des doigts.", "pre": "au_uma_mao"}, {"id": "mortal", "name": "Mortal de costas", "cat": "flip", "lvl": 3, "en": "Salto arrière", "what": "Un salto arrière debout. Seulement après des sauts groupés solides et des essais avec parade sur sol souple. Pas besoin de trampoline, mais une parade, oui.", "cues": ["Saute VERS LE HAUT, pas en arrière.", "Les bras montent, les genoux viennent à la poitrine.", "Repère le sol et atterris genoux pliés."], "mistakes": ["Jeter la tête en arrière trop tôt.", "Sauter en arrière et bas."], "drills": ["Sauts groupés en allant chercher haut.", "Roulade arrière et roulade arrière jusqu'en pompe.", "Salto depuis une petite surface surélevée vers un tapis épais, avec parade.", "Salto sur l'herbe, avec parade."], "alt": "Roulade arrière + sauts groupés.", "pre": "jump_tuck"}, {"id": "folha_seca", "name": "Folha seca", "cat": "flip", "lvl": 3, "en": "Feuille morte", "what": "Un salto arrière qui sort d'un coup de pied : la jambe qui frappe monte et tire le corps en arrière, réception sur cette même jambe.", "cues": ["Le mortal doit être solide avant.", "Frappe haut avec la jambe tendue.", "Atterris sur la jambe qui frappe."], "mistakes": ["Coup bas, pas de rotation."], "drills": ["Coups de pied de face hauts avec un petit saut.", "Mortal sur l'herbe.", "Folha seca avec parade sur l'herbe."], "alt": "Mortal de costas.", "pre": "mortal"}, {"id": "s_dobrado", "name": "S-dobrado", "cat": "flip", "lvl": 3, "en": "Famille du B-twist", "what": "Une acrobatie vrillée cousine du B-twist : corps horizontal, jambes en ciseaux en l'air. Ton travail de B-twist en est la base.", "cues": ["Grand balancé de bras et buste bas.", "Le lancer de jambe crée la rotation.", "Repère la réception."], "mistakes": ["Rester trop droit."], "drills": ["B-kick (papillon) sur l'herbe.", "Exercices de B-twist.", "S-dobrado avec parade sur l'herbe."], "alt": "B-kick.", "pre": "mortal"}], "combos": [{"id": "c1", "lvl": 1, "name": "Séquence 1 - Entrée", "moves": ["Ginga", "Meia-lua de frente", "Ginga", "Esquiva lateral", "Negativa", "Rolê", "Ginga"]}, {"id": "c2", "lvl": 1, "name": "Séquence 2 - Queixada", "moves": ["Ginga", "Queixada", "Cocorinha", "Ginga", "Bênção", "Esquiva baixa", "Ginga"]}, {"id": "c3", "lvl": 1, "name": "Séquence 3 - Armada", "moves": ["Ginga", "Armada", "Negativa", "Rolê", "Aú", "Ginga"]}, {"id": "c4", "lvl": 1, "name": "Séquence 4 - Sol", "moves": ["Ginga", "Cocorinha", "Queda de quatro", "Negativa", "Rolê", "Queda de rins", "Ginga"]}, {"id": "c5", "lvl": 2, "name": "Séquence 5 - Compasso", "moves": ["Ginga", "Esquiva lateral", "Meia-lua de compasso", "Rolê", "Negativa", "Ginga"]}, {"id": "c6", "lvl": 2, "name": "Séquence 6 - Balayage", "moves": ["Ginga", "Martelo", "Esquiva baixa", "Negativa", "Rasteira", "Rolê", "Ginga"]}, {"id": "c7", "lvl": 2, "name": "Séquence 7 - Floreio", "moves": ["Ginga", "Armada", "Aú fechado", "Queda de rins", "Aú de cabeça", "Ginga"]}, {"id": "c8", "lvl": 2, "name": "Séquence 8 - Macaco", "moves": ["Ginga", "Queixada", "Cocorinha", const NOSIDE=new Set(["jump_tuck","cocorinha_def","queda4","ponte","bananeira","ginga","esq_frente","cruz","contra","cabecada"]);
function doseFor(m){
  const side=NOSIDE.has(m.id)?"":T.d.side;
  const kindHold=["queda_rins","ponte","resistencia","au_quebrado"];
  const kindAtt=["piao_cabeca","pulada","martelo_rodado","parafuso","piao_mao","relogio","au_sem_mao","mortal","folha_seca","s_dobrado","macaco","macaco_pe"];
  if(m.pre&&!S.mastered[m.pre])return T.d.drills(MOVES[m.pre].name);
  if(m.id==="ginga")return T.d.flow;
  if(m.id==="bananeira")return T.d.alive;
  if(kindHold.includes(m.id))return ({1:"3 x 20 s",2:"3 x 12 s",3:"4 x 5 s"})[m.lvl]+side;
  if(kindAtt.includes(m.id))return m.cat==="flip"?T.d.flip:T.d.att;
  return ({1:"3 x 6",2:"3 x 5",3:"3 x 3"})[m.lvl]+side;
}
function buildSession(){
  if(!S.pick.length)return;
  const budget=({30:4,45:6,60:8,75:10})[S.mins]||8;
  const picks=S.pick.slice(0,budget);
  const base=Math.floor(budget/picks.length),extra=budget%picks.length;
  const out=[];
  const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
  picks.forEach((cid,ci)=>{
    const perCat=base+(ci<extra?1:0);
    const L=S.levels[cid];
    const pool=D.moves.filter(m=>m.cat===cid&&m.lvl<=L);
    const cur=pool.filter(m=>m.lvl===L&&!S.mastered[m.id]);
    const rest=pool.filter(m=>!cur.includes(m));
    [...sh(cur),...sh(rest)].slice(0,perCat).forEach(m=>out.push({move:m.id}));
  });
  const minL=Math.min(...S.pick.map(c=>S.levels[c]));
  const cs=D.combos.filter(c=>c.lvl===minL);
  const combo=cs[Math.floor(Math.random()*cs.length)]||D.combos[0];
  S.built={blocks:out,combo:combo.id,mins:S.mins};save();
}
function today(){
  let h=`<h2>${T.build}</h2><div class="card"><div class="small mut" style="margin-bottom:8px">${T.hint}</div>
  <div class="chips">${D.cats.map(c=>`<button class="chip ${S.pick.includes(c.id)?"on":""}" data-pick="${c.id}">${esc(c.name)} · L${S.levels[c.id]}</button>`).join("")}</div>
  <div class="small mut" style="margin-bottom:6px">${T.len}</div>
  <div class="seg" style="margin-bottom:12px">${[30,45,60,75].map(n=>`<button class="${S.mins===n?"on":""}" data-mins="${n}">${n} min</button>`).join("")}</div>
  <button class="btn" id="build" ${S.pick.length?"":"disabled"}>${T.buildBtn}</button></div>`;
  if(S.built&&S.built.blocks.length){
    const b=S.built;
    h+=`<div class="card"><h3 style="margin-top:0">${T.warm}</h3><ul class="small">${D.warmup.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <div class="card"><h3 style="margin-top:0">${T.skills}</h3>${b.blocks.map(x=>{const m=MOVES[x.move];return `<div class="blk"><div><span class="dot" style="background:${CATS[m.cat].color}"></span>${mvLink(m.id)}<div class="small mut">${esc(m.en)}</div></div><div class="d">${esc(doseFor(m))}</div></div>`}).join("")}
    <div class="small mut" style="margin-top:8px">${T.tap}</div></div>
    <div class="card"><h3 style="margin-top:0">${T.combo}</h3>${comboHTML(COMBOS[b.combo])}<div class="small mut" style="margin-top:6px">${T.comboHint}</div></div>
    <div class="card"><h3 style="margin-top:0">${T.cool}</h3><ul class="small">${D.cooldown.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    <button class="btn ghost" id="build2" ${S.pick.length?"":"disabled"}>${T.shuffle}</button>`;
  }
  return h;
}
function comboHTML(c){return `<b>${esc(c.name)}</b> ${lvTag(c.lvl)}<div class="seq">${c.moves.map((n,i)=>(i?'<span class="arrow">→</span>':'')+`<span ${NAMEID[n]?`class="link" data-mv="${NAMEID[n]}"`:""}>${esc(n)}</span>`).join("")}</div>`}

function program(){
  const total=D.program.length*3,dn=Object.keys(S.done).filter(k=>S.done[k]).length;
  const w=D.program[S.week-1],ph=D.phases[w.phase-1];
  let h=`<h2>${T.prog}</h2><div class="card"><div class="row"><div class="small mut">${dn} / ${total} ${T.done}</div><div style="text-align:right" class="small done">${Math.round(dn/total*100)}%</div></div><div class="bar" style="margin-top:6px"><div style="width:${dn/total*100}%"></div></div><div class="small mut" style="margin-top:10px">${esc(D.schedule)}</div></div>
  <div class="weeks">${D.program.map(x=>{const full=["A","B","C"].every(k=>S.done[x.week+k]);return `<button class="${x.week===S.week?"on":""} ${full?"full":""}" data-week="${x.week}">${x.week}</button>`}).join("")}</div>
  <div class="card"><b>${esc(ph.name)}</b> · ${T.week} ${w.week}${w.deload?'<span class="tag">'+(w.week===12?T.test:T.deload)+'</span>':""}<div class="small mut" style="margin-top:4px">${esc(ph.goal)}</div>${w.note?`<div class="small" style="margin-top:8px">${esc(w.note)}</div>`:""}</div>`;
  w.sessions.forEach(s=>{
    const k=w.week+s.key;
    h+=`<div class="card"><h3 style="margin:0">${T.session} ${s.key} · ${esc(s.title)}</h3>
    <div class="small mut" style="margin:6px 0 4px">${T.warmSee}</div>
    ${s.blocks.map(b=>{const m=MOVES[b.move];return `<div class="blk"><div><span class="dot" style="background:${CATS[m.cat].color}"></span>${mvLink(m.id)} ${S.mastered[m.id]?'<span class="done">✓</span>':""}</div><div class="d">${esc(b.dose)}</div></div>`}).join("")}
    <h3>${T.combos} · ${esc(s.comboDose)}</h3>${s.combos.map(c=>`<div style="margin-bottom:8px">${comboHTML(COMBOS[c])}</div>`).join("")}
    <h3>${T.cond}</h3><ul class="small">${s.conditioning.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <label class="chk"><input type="checkbox" data-done="${k}" ${S.done[k]?"checked":""}> ${T.sDone}</label></div>`;
  });
  return h;
}

function library(){
  const c=CATS[S.libCat];
  const ms=D.moves.filter(m=>m.cat===c.id).sort((a,b)=>a.lvl-b.lvl);
  let h=`<h2>${T.lib}</h2><div class="chips">${D.cats.map(x=>`<button class="chip ${S.libCat===x.id?"on":""}" data-lib="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="card"><b><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</b>${sub(c)}<div class="small mut" style="margin-top:6px">${esc(c.intro)}</div></div><div class="card">`;
  ms.forEach(m=>{h+=`<div class="move" data-mv="${m.id}"><div><b>${esc(m.name)}</b> ${S.mastered[m.id]?'<span class="done">✓</span>':""}<div class="en">${esc(m.en)}</div></div>${lvTag(m.lvl)}</div>`});
  h+=`</div><h3>${T.combos}</h3>${D.combos.map(cb=>`<div class="card">${comboHTML(cb)}</div>`).join("")}`;
  return h;
}
function openMove(id){
  const m=MOVES[id],c=CATS[m.cat];
  let h=`<button class="x" id="closeM">✕</button><div class="small" style="color:${c.color}">${esc(c.name)} · ${D.levels[m.lvl]}</div><h2 style="margin:4px 0 2px">${esc(m.name)}</h2><div class="mut">${esc(m.en)}</div>
  <p>${esc(m.what)}</p><h3>${T.cues}</h3><ul>${m.cues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3>${T.mist}</h3><ul>${m.mistakes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <h3>${T.progr}</h3><ol style="padding-left:20px">${m.drills.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
  <h3>${T.easier}</h3><p class="small">${esc(m.alt)}</p>`;
  if(m.pre)h+=`<h3>${T.first}</h3><div class="seq"><span class="link" data-mv="${m.pre}">${esc(MOVES[m.pre].name)}</span></div>`;
  if(m.defends)h+=`<h3>${T.against}</h3><div class="seq">${m.defends.map(d=>`<span class="link" data-mv="${d}">${esc(MOVES[d].name)}</span>`).join("")}</div>`;
  const counters=D.moves.filter(x=>x.defends&&x.defends.includes(m.id));
  if(counters.length)h+=`<h3>${T.defend}</h3><div class="seq">${counters.map(d=>`<span class="link" data-mv="${d.id}">${esc(d.name)}</span>`).join("")}</div>`;
  h+=`<label class="chk" style="margin-top:12px"><input type="checkbox" data-mast="${m.id}" ${S.mastered[m.id]?"checked":""}> ${T.own}</label>`;
  $("#sheet").innerHTML=h;$("#modal").classList.add("open");$("#sheet").scrollTop=0;
}

function progress(){
  let h=`<h2>${T.progress}</h2><div class="card small mut">${T.progHint}</div>`;
  D.cats.forEach(c=>{
    const all=D.moves.filter(m=>m.cat===c.id),own=all.filter(m=>S.mastered[m.id]).length;
    h+=`<div class="card"><div class="row"><b><span class="dot" style="background:${c.color}"></span>${esc(c.name)}</b><div class="small mut" style="text-align:right">${own} / ${all.length} ${T.owned}</div></div>
    <div class="bar" style="margin:8px 0 10px"><div style="width:${own/all.length*100}%;background:${c.color}"></div></div>
    <div class="seg">${[1,2,3].map(l=>`<button class="${S.levels[c.id]===l?"on":""}" data-lvl="${c.id}:${l}">${D.levels[l]}</button>`).join("")}</div></div>`;
  });
  const dn=Object.values(S.done).filter(Boolean).length;
  h+=`<div class="card"><b>${T.prog}</b><div class="small mut">${dn} ${T.of36}</div></div><button class="btn ghost" id="reset">${T.reset}</button>`;
  return h;
}

function about(){
  return `<h2>${T.about}</h2><div class="card"><b>${T.lang}</b><div class="seg" style="margin-top:8px">${[["en","English"],["pt","Português"],["fr","Français"]].map(([l,n])=>`<button class="${S.lang===l?"on":""}" data-lang="${l}">${n}</button>`).join("")}</div></div>
  <div class="card"><b>${T.how}</b><ul class="small">${T.howL.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="card"><b>${T.safety}</b><ul class="small">${D.safety.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></div>
  <div class="card"><b>${T.sources}</b>${D.sources.map(s=>`<div style="margin-top:10px"><div>${esc(s.author)}</div><div class="small mut">${s.works.map(esc).join(" · ")}</div></div>`).join("")}</div>
  <div class="ai">${esc(D.aiNote)}</div>`;
}

function render(){nav();$("#view").innerHTML=({today,program,library,progress,about})[S.tab]();}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-lang],[data-pick],[data-mins],[data-week],[data-lib],[data-mv],[data-lvl],#build,#build2,#reset,#closeM");
  if(!t){if(e.target.id==="modal"){$("#modal").classList.remove("open");render()}return}
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;window.scrollTo(0,0)}
  else if(d.lang){setLang(d.lang)}
  else if(d.pick){S.pick=S.pick.includes(d.pick)?S.pick.filter(x=>x!==d.pick):[...S.pick,d.pick]}
  else if(d.mins){S.mins=+d.mins}
  else if(d.week){S.week=+d.week}
  else if(d.lib){S.libCat=d.lib}
  else if(d.mv){openMove(d.mv);return}
  else if(d.lvl){const[c,l]=d.lvl.split(":");S.levels[c]=+l}
  else if(t.id==="build"||t.id==="build2"){buildSession()}
  else if(t.id==="reset"){if(confirm(T.resetQ)){S.mastered={};S.done={};S.built=null}}
  else if(t.id==="closeM"){$("#modal").classList.remove("open");render();return}
  save();render();
});
document.addEventListener("change",e=>{
  const d=e.target.dataset;
  if(d.done){S.done[d.done]=e.target.checked;save();render()}
  if(d.mast){S.mastered[d.mast]=e.target.checked;save();const y=window.scrollY;render();window.scrollTo(0,y)}
});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
